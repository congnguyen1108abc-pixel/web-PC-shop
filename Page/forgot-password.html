<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên Mật Khẩu - HYPER CORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .widget-popup {
            position: relative;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .widget-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .widget-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            color: #000000;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-close:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: rotate(90deg);
        }

        .widget-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .widget-title {
            font-size: 32px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
            text-align: center;
        }

        .widget-subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .widget-input {
            width: 100%;
            height: 52px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }

        .widget-input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        }

        .widget-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #000000;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .widget-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .widget-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .back-link a {
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: #333333;
            text-decoration: underline;
        }

        /* Error & Success Banners */
        .error-banner, .success-banner {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-banner {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
        }

        .success-banner {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #16a34a;
        }

        .error-banner.show, .success-banner.show {
            display: flex;
        }

        /* Loading spinner */
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .widget-submit.loading .btn-spinner {
            display: block;
        }

        .widget-submit.loading .btn-text {
            display: none;
        }

        @media(max-width: 600px) {
            .widget-box {
                padding: 30px 24px;
            }
            .widget-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="widget-popup">
        <div class="widget-box">
            <button class="widget-close" onclick="window.location.href='/Login'">✕</button>

            <div class="widget-icon">🔐</div>
            <h2 class="widget-title">Quên Mật Khẩu?</h2>
            <p class="widget-subtitle">
                Nhập email của bạn và chúng tôi sẽ gửi link đặt lại mật khẩu.
            </p>

            <!-- ERROR BANNER -->
            <div class="error-banner" id="errorBanner">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="errorMsg">Có lỗi xảy ra</span>
            </div>

            <!-- SUCCESS BANNER -->
            <div class="success-banner" id="successBanner">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span id="successMsg">Email đã được gửi!</span>
            </div>

            <form id="forgotForm" onsubmit="return handleForgotPassword(event)">
                <input type="email" id="emailInput" class="widget-input" placeholder="Email của bạn" required />

                <button type="submit" class="widget-submit" id="submitBtn">
                    <div class="btn-spinner"></div>
                    <span class="btn-text">Xác nhận</span>
                </button>
            </form>

            <div class="back-link">
                Nhớ mật khẩu?
                <a href="/Login">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            const successBanner = document.getElementById('successBanner');
            successBanner.classList.remove('show');
            document.getElementById('errorMsg').textContent = msg;
            banner.classList.add('show');
        }

        function showSuccess(msg) {
            const banner = document.getElementById('successBanner');
            const errorBanner = document.getElementById('errorBanner');
            errorBanner.classList.remove('show');
            document.getElementById('successMsg').textContent = msg;
            banner.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorBanner').classList.remove('show');
            document.getElementById('successBanner').classList.remove('show');
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('submitBtn');
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('emailInput').value.trim();

            if (!email) {
                showError('Vui lòng nhập email!');
                return false;
            }

            setLoading(true);

            try {
                const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Có lỗi xảy ra khi gửi email. Vui lòng thử lại.');
                    setLoading(false);
                    return false;
                }

                // Success - always show success message (even if email doesn't exist for security)
                showSuccess('✅ Nếu email tồn tại, bạn sẽ nhận được link đặt lại mật khẩu trong vài phút. Vui lòng kiểm tra hộp thư!');
                document.getElementById('emailInput').value = '';
                setLoading(false);

            } catch (err) {
                console.error('Error:', err);
                showError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
                setLoading(false);
            }

            return false;
        }
    </script>
</body>
</html>
