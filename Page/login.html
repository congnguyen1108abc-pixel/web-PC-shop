

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PC MASTER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #07111f, #020617 45%, #000000 100%);
            color: white;
        }

        /* BACKGROUND PARTICLES */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

            .particles span {
                position: absolute;
                width: 4px;
                height: 4px;
                background: #00d9ff;
                border-radius: 50%;
                box-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff;
                animation: animateParticles linear infinite;
            }

        /* Lưu ý: Dùng @@ để tránh lỗi C# trong Razor */
        @keyframes animateParticles {
            from {
                transform: translateY(110vh) scale(0);
            }

            to {
                transform: translateY(-10vh) scale(1);
            }
        }

        /* LIQUID BLOBS */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: blobMove 12s infinite alternate ease-in-out;
        }

        .blob1 {
            width: 450px;
            height: 450px;
            background: #00d9ff;
            top: -150px;
            left: -150px;
        }

        .blob2 {
            width: 400px;
            height: 400px;
            background: #0066ff;
            bottom: -150px;
            right: -150px;
            animation-duration: 18s;
        }

        @keyframes blobMove {
            0% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(100px, -50px) scale(1.1);
            }

            100% {
                transform: translate(-50px, 80px) scale(0.9);
            }
        }

        /* LOGIN BOX */
        .login-box {
            position: relative;
            width: 420px;
            padding: 50px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 217, 255, 0.2);
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 217, 255, 0.1);
            z-index: 10;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #00d9ff;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.8);
        }

        .subtitle {
            text-align: center;
            color: #9edfff;
            font-size: 12px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .input-box {
            position: relative;
            margin-bottom: 30px;
        }

            .input-box input {
                width: 100%;
                padding: 16px 20px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(0, 217, 255, 0.2);
                border-radius: 12px;
                outline: none;
                color: #fff;
                font-size: 16px;
                transition: 0.3s;
            }

                .input-box input:focus {
                    border-color: #00d9ff;
                    background: rgba(255, 255, 255, 0.08);
                    box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
                }

            .input-box label {
                position: absolute;
                top: -10px;
                left: 15px;
                background: #060b18; /* Khớp với màu nền blur */
                padding: 0 8px;
                color: #00d9ff;
                font-size: 13px;
                font-weight: 600;
                border-radius: 4px;
            }

        /* BUTTON */
        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(90deg, #00d9ff, #005eff);
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0, 94, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            .login-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 0 25px #00d9ff;
            }

            .login-btn:active {
                transform: translateY(0);
            }

        /* FOOTER */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #9edfff;
            font-size: 14px;
        }

            .footer a {
                color: #00d9ff;
                text-decoration: none;
                font-weight: 600;
                margin-left: 5px;
                transition: 0.3s;
            }

                .footer a:hover {
                    text-shadow: 0 0 10px #00d9ff;
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="particles">
        <span style="left:5%;  animation-duration:8s;"></span>
        <span style="left:15%; animation-duration:12s;"></span>
        <span style="left:30%; animation-duration:10s;"></span>
        <span style="left:45%; animation-duration:14s;"></span>
        <span style="left:60%; animation-duration:9s;"></span>
        <span style="left:75%; animation-duration:13s;"></span>
        <span style="left:90%; animation-duration:11s;"></span>
    </div>

    <div class="login-box">
        <div class="logo">PC MASTER</div>
        <div class="subtitle">Next Gen Login Experience</div>

        <form method="post">
            <div class="input-box">
                <label>Email </label>
                <input type="email" placeholder="name@example.com" required />
            </div>

            <div class="input-box">
                <label>Mật khẩu</label>
                <input type="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="login-btn">
                Đăng nhập
            </button>
        </form>

        <div class="footer">
            Bạn không có tài khoản
            <a href="#">Đăng ký</a>
        </div>
    </div>

</body>
</html>
