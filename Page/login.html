<!-- LOGIN POPUP -->

<div class="widget-popup" id="loginPopup">

    <div class="widget-box">

        <!-- CLOSE BUTTON -->

        <button class="widget-close" onclick="closeLoginPopup()">

            ✕

        </button>

        <!-- TITLE -->

        <h2 class="widget-title">
            Đăng Nhập
        </h2>

        <p class="widget-subtitle">
            Chào mừng quay trở lại HYPER CORE
        </p>

        <!-- FORM -->

        <form id="loginForm" onsubmit="return handleLogin(event)">

            <!-- INPUT -->

            <input type="email" id="loginEmail" class="widget-input" placeholder="Email" required />

            <input type="password" id="loginPassword" class="widget-input" placeholder="Mật khẩu" required />

            <!-- OPTIONS -->

            <div class="widget-options">

                <label class="remember-box">

                    <input type="checkbox" />

                    <span>Nhớ mật khẩu</span>

                </label>

                <a href="#" class="forgot-link">

                    Quên mật khẩu?

                </a>

            </div>

            <!-- LOGIN BUTTON -->

            <button type="submit" class="widget-submit">
                Đăng Nhập
            </button>

        </form>

        <!-- DIVIDER -->

        <div class="divider">
            HOẶC
        </div>

        <!-- GOOGLE LOGIN -->

        <button class="google-btn">

            <div class="google-icon">
                G
            </div>

            <span>
                Đăng nhập bằng Google
            </span>

        </button>

        <!-- REGISTER -->

        <div class="register-text">

            Chưa có tài khoản?

            <a href="javascript:void(0)" class="register-link" onclick="switchToRegister()">

                Đăng ký ngay

            </a>

        </div>

    </div>

</div>
