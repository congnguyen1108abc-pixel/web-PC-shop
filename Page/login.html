<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HYPER CORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at top left, #11243f 0%, transparent 30%),
                radial-gradient(circle at bottom right, #1d4f91 0%, transparent 35%),
                linear-gradient(180deg, #02050b 0%, #07111f 50%, #000000 100%);
            color: white;
            position: relative;
        }

        /* ================================= */
        /* 3D BACKGROUND */
        /* ================================= */

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(1000px) rotateX(70deg) scale(2);
            transform-origin: top;
            opacity: .4;
        }

        /* ================================= */
        /* LIQUID GLASS BLOBS */
        /* ================================= */

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .45;
            animation: blobMove 14s ease-in-out infinite alternate;
        }

        .blob1 {
            width: 500px;
            height: 500px;
            background: #38bdf8;
            top: -180px;
            left: -120px;
        }

        .blob2 {
            width: 450px;
            height: 450px;
            background: #2563eb;
            bottom: -180px;
            right: -120px;
            animation-duration: 18s;
        }

        .blob3 {
            width: 300px;
            height: 300px;
            background: #7dd3fc;
            top: 40%;
            left: 40%;
            opacity: .18;
            animation-duration: 12s;
        }

        @keyframes blobMove {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(80px, -40px) scale(1.15);
            }

            100% {
                transform: translate(-40px, 60px) scale(.9);
            }
        }

        /* ================================= */
        /* PARTICLES */
        /* ================================= */

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(125, 211, 252, .8);
            box-shadow: 0 0 10px rgba(125, 211, 252, .8);
            animation: particleMove linear infinite;
        }

        @keyframes particleMove {

            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* ================================= */
        /* LOGIN BOX */
        /* ================================= */

        .login-box {
            position: relative;
            width: 430px;
            padding: 50px;
            border-radius: 35px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, .10),
                    rgba(255, 255, 255, .03));

            border: 1px solid rgba(255, 255, 255, .12);

            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, .5),
                inset 0 1px 1px rgba(255, 255, 255, .15);

            overflow: hidden;
            z-index: 10;

            animation: fadeIn 1s ease;
        }

        /* Liquid Glass Reflection */

        .login-box::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            top: -120px;
            right: -100px;
            filter: blur(20px);
        }

        .login-box::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, .08);
            pointer-events: none;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(40px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ================================= */
        /* LOGO */
        /* ================================= */

        .logo {
            text-align: center;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;

            background: linear-gradient(90deg, #ffffff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, .65);
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* ================================= */
        /* INPUT */
        /* ================================= */

        .input-box {
            position: relative;
            margin-bottom: 28px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;

            border: 1px solid rgba(255, 255, 255, .10);

            background: rgba(255, 255, 255, .05);

            color: white;
            font-size: 15px;

            outline: none;

            backdrop-filter: blur(15px);

            transition: .35s;
        }

        .input-box input:focus {

            border-color: rgba(125, 211, 252, .7);

            background: rgba(255, 255, 255, .08);

            box-shadow:
                0 0 20px rgba(125, 211, 252, .15),
                inset 0 1px 1px rgba(255, 255, 255, .08);
        }

        .input-box label {
            position: absolute;
            top: -10px;
            left: 16px;

            padding: 0 10px;

            background: #08101b;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #7dd3fc;
        }

        /* ================================= */
        /* BUTTON */
        /* ================================= */

        .login-btn {
            width: 100%;
            padding: 17px;

            border: none;
            border-radius: 18px;

            font-size: 17px;
            font-weight: 700;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #38bdf8,
                    #2563eb);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, .25);

            transition: .4s;
        }

        .login-btn:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 35px rgba(56, 189, 248, .35);
        }

        .login-btn:active {
            transform: scale(.98);
        }

        /* ================================= */
        /* FOOTER */
        /* ================================= */

        .footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, .65);
            font-size: 14px;
        }

        .footer a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
        }

        .footer a:hover {
            color: white;
            text-shadow: 0 0 10px rgba(125, 211, 252, .5);
        }

        /* ================================= */
        /* RESPONSIVE */
        /* ================================= */

        @media(max-width:500px) {

            .login-box {
                width: 92%;
                padding: 35px 25px;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- 3D GRID -->
    <div class="grid-bg"></div>

    <!-- BLOBS -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- PARTICLES -->
    <div class="particles">

        <span style="left:5%; animation-duration:8s;"></span>
        <span style="left:15%; animation-duration:11s;"></span>
        <span style="left:25%; animation-duration:9s;"></span>
        <span style="left:40%; animation-duration:13s;"></span>
        <span style="left:55%; animation-duration:10s;"></span>
        <span style="left:70%; animation-duration:14s;"></span>
        <span style="left:85%; animation-duration:12s;"></span>

    </div>

    <!-- LOGIN -->

    <div class="login-box">

        <div class="logo">
            HYPER CORE
        </div>

        <div class="subtitle">
            Next Gen Experience
        </div>

        <form>

            <div class="input-box">

                <label>Email</label>

                <input type="email" placeholder="name@example.com" required />

            </div>

            <div class="input-box">

                <label>Mật khẩu</label>

                <input type="password" placeholder="••••••••" required />

            </div>

            <button type="submit" class="login-btn">
                Đăng nhập
            </button>

        </form>

        <div class="footer">

            Bạn chưa có tài khoản?
            <a href="#">
                Đăng ký
            </a>

        </div>

    </div>

</body>

</html>
