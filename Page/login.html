<!-- LOGIN POPUP -->

<div class="widget-popup" id="loginPopup">

    <div class="widget-box">

        <!-- CLOSE BUTTON -->

        <button class="widget-close" onclick="closeLoginPopup()">

            ✕

        </button>

        <!-- TITLE -->

        <h2 class="widget-title">
            Đăng Nhập
        </h2>

        <p class="widget-subtitle">
            Chào mừng quay trở lại HYPER CORE
        </p>

        <!-- INPUT -->

        <input type="text" class="widget-input" placeholder="Tên đăng nhập" />

        <input type="password" class="widget-input" placeholder="Mật khẩu" />

        <!-- OPTIONS -->

        <div class="widget-options">

            <label class="remember-box">

                <input type="checkbox" />

                <span>Nhớ mật khẩu</span>

            </label>

            <a href="#" class="forgot-link">

                Quên mật khẩu?

            </a>

        </div>

        <!-- LOGIN BUTTON -->

        <button class="widget-submit">
            Đăng Nhập
        </button>

        <!-- DIVIDER -->

        <div class="divider">
            HOẶC
        </div>

        <!-- GOOGLE LOGIN -->

        <button class="google-btn">

            <div class="google-icon">
                G
            </div>

            <span>
                Đăng nhập bằng Google
            </span>

        </button>

        <!-- REGISTER -->

        <div class="register-text">

            Chưa có tài khoản?

            <a href="javascript:void(0)" class="register-link" onclick="switchToRegister()">

                Đăng ký ngay

            </a>

        </div>

    </div>

</div>
