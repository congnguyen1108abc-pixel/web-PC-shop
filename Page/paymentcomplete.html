<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt Hàng Thành Công - HYPER CORE</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --blue: #38bdf8;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #f8f9fa 0%, #ffffff 100%);
            color: #111827;
            padding: 20px;
        }

        /* ORBS */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .25;
            z-index: -1;
            animation: float 7s ease-in-out infinite;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            background: #e5e7eb;
            top: -140px;
            left: -120px;
        }

        .orb2 {
            width: 350px;
            height: 350px;
            background: #d1d5db;
            bottom: -120px;
            right: -120px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* CARD */
        .success-card {
            width: 95%;
            max-width: 540px;
            padding: 60px 45px;
            border-radius: 36px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-card::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 50%;
            filter: blur(90px);
            top: -120px;
            right: -120px;
        }

        /* ICON */
        .status-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            animation: pop .6s ease;
            border: 2.5px solid #000;
            background: #fff;
        }

        .status-icon.success {
            border-color: var(--success);
            color: var(--success);
        }

        .status-icon.failed {
            border-color: var(--error);
            color: var(--error);
        }

        .status-icon.cancelled {
            border-color: var(--warning);
            color: var(--warning);
        }

        .status-icon.loading {
            border-color: #9ca3af;
            color: #9ca3af;
            font-size: 32px;
        }

        @keyframes pop {
            0% {
                transform: scale(.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* TEXT */
        .status-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 14px;
            color: #000;
        }

        .status-desc {
            color: #4b5563;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* ORDER BOX */
        .order-box {
            padding: 22px;
            border-radius: 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            margin-bottom: 30px;
            text-align: left;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            color: #4b5563;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }

        .order-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .order-row:first-child {
            padding-top: 0;
        }

        .order-value {
            color: #000;
            font-weight: 700;
            font-size: 14px;
        }

        .order-value.big {
            font-size: 18px;
            color: #000;
        }

        /* STATUS BADGE */
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .4px;
        }

        .badge-success {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-failed {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-cancelled {
            background: #f3f4f6;
            color: #374151;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .home-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 18px;
            background: #000;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .35s;
            letter-spacing: .4px;
        }

        .home-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.2);
        }

        .secondary-btn {
            width: 100%;
            height: 52px;
            border: 1.5px solid #e5e7eb;
            border-radius: 16px;
            background: transparent;
            color: #374151;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .secondary-btn:hover {
            background: #f9fafb;
            border-color: #000;
            color: #000;
        }

        .secure-text {
            margin-top: 22px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* LOADING */
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .success-card {
                padding: 40px 22px;
            }

            .status-title {
                font-size: 28px;
            }

            .status-icon {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="success-card">
        <div class="status-icon loading" id="statusIcon">
            <div class="spinner"></div>
        </div>

        <h1 class="status-title" id="statusTitle">Đang xử lý...</h1>

        <p class="status-desc" id="statusDesc">
            Vui lòng đợi trong khi chúng tôi xác nhận giao dịch của bạn.
        </p>

        <div class="order-box" id="orderBox" style="display:none;">
            <div class="order-row">
                <span>Mã đơn hàng</span>
                <span class="order-value" id="orderIdDisplay">—</span>
            </div>
            <div class="order-row">
                <span>Phương thức</span>
                <span class="order-value" id="methodDisplay">—</span>
            </div>
            <div class="order-row" id="txnRow" style="display:none;">
                <span>Mã giao dịch</span>
                <span class="order-value" id="txnDisplay">—</span>
            </div>
            <div class="order-row">
                <span>Trạng thái</span>
                <span class="status-badge badge-pending" id="statusBadge">Đang chờ</span>
            </div>
        </div>

        <div class="btn-group" id="btnGroup" style="display:none;">
            <button class="home-btn" onclick="window.location.href='/Homepage'">
                🏠 QUAY VỀ TRANG CHỦ
            </button>
            <button class="secondary-btn" id="orderStatusBtn" onclick="window.location.href='/order-status'"
                style="display:none;">
                📦 XEM TRẠNG THÁI ĐƠN HÀNG
            </button>
            <button class="secondary-btn" id="shopMoreBtn" onclick="window.location.href='/Products'">
                Tiếp tục mua sắm
            </button>
        </div>

        <p class="secure-text">🔒 Giao dịch được mã hóa bảo mật</p>
    </div>

    <script>
        // ==========================================
        // LUCKY SPIN REWARDS POPUP SYSTEM
        // ==========================================
        function injectLuckyPopupStyles() {
            if (document.getElementById('lucky-popup-styles')) return;
            const style = document.createElement('style');
            style.id = 'lucky-popup-styles';
            style.textContent = `
                .lucky-popup-overlay {
                    position: fixed;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.4);
                    backdrop-filter: blur(8px);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 9999;
                    opacity: 0;
                    transition: opacity 0.3s ease;
                }
                .lucky-popup-overlay.active {
                    opacity: 1;
                }
                .lucky-popup-card {
                    background: rgba(255, 255, 255, 0.98);
                    border: 1px solid rgba(0, 0, 0, 0.08);
                    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
                    border-radius: 28px;
                    padding: 40px 30px;
                    width: min(480px, 90vw);
                    text-align: center;
                    transform: scale(0.9);
                    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                }
                .lucky-popup-overlay.active .lucky-popup-card {
                    transform: scale(1);
                }
                .lucky-popup-icon {
                    font-size: 64px;
                    margin-bottom: 16px;
                    display: inline-block;
                    animation: popIcon 0.6s ease;
                }
                .lucky-popup-title {
                    font-size: 28px;
                    font-weight: 900;
                    margin-bottom: 12px;
                    color: #111;
                    letter-spacing: -0.5px;
                }
                .lucky-popup-subtitle {
                    font-size: 18px;
                    font-weight: 750;
                    color: #059669;
                    margin-bottom: 20px;
                    line-height: 1.4;
                }
                .lucky-popup-content {
                    background: #f3f4f6;
                    border-radius: 16px;
                    padding: 18px;
                    margin-bottom: 24px;
                    font-size: 14.5px;
                    color: #4b5563;
                    text-align: left;
                    line-height: 1.6;
                }
                .lucky-popup-buttons {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                }
                .lucky-popup-btn-primary {
                    background: #111;
                    color: #fff;
                    border: none;
                    border-radius: 14px;
                    padding: 14px;
                    font-weight: 700;
                    font-size: 15px;
                    cursor: pointer;
                    transition: background 0.2s, transform 0.2s;
                }
                .lucky-popup-btn-primary:hover {
                    background: #222;
                    transform: translateY(-2px);
                }
                .lucky-popup-btn-secondary {
                    background: transparent;
                    color: #4b5563;
                    border: 1.5px solid #e5e7eb;
                    border-radius: 14px;
                    padding: 12px;
                    font-weight: 600;
                    font-size: 14px;
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .lucky-popup-btn-secondary:hover {
                    background: #f9fafb;
                    color: #111;
                    border-color: #111;
                }
                .payment-confetti {
                    position: fixed;
                    width: 10px;
                    height: 16px;
                    top: -20px;
                    left: 50%;
                    z-index: 99999;
                    pointer-events: none;
                    border-radius: 3px;
                    animation: paymentConfettiFall 1.8s linear forwards;
                }
                @keyframes paymentConfettiFall {
                    to {
                        transform: translateY(120vh) rotate(720deg);
                        opacity: 0;
                    }
                }
                @keyframes popIcon {
                    0% { transform: scale(0.5); }
                    100% { transform: scale(1); }
                }
            `;
            document.head.appendChild(style);
        }

        function launchPaymentConfetti(count = 50) {
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'];
            const centerX = window.innerWidth / 2;
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');
                piece.className = 'payment-confetti';
                piece.style.left = `${centerX + (Math.random() * 300 - 150)}px`;
                piece.style.top = `${Math.random() * -100 - 20}px`;
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = `${6 + Math.random() * 8}px`;
                piece.style.height = `${10 + Math.random() * 14}px`;
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                piece.style.animationDuration = `${1200 + Math.random() * 800}ms`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2000);
            }
        }

        function showEligiblePopup(amount, spins) {
            const rank = amount < 15000000 ? 'Silver' : (amount < 20000000 ? 'Gold' : (amount < 30000000 ? 'Platinum' : 'VIP'));

            // Save state to localStorage as required
            localStorage.setItem('orderAmount', amount);
            let currentSpins = parseInt(localStorage.getItem('availableSpins') || '0');
            localStorage.setItem('availableSpins', currentSpins + spins);
            localStorage.setItem('customerRank', rank);

            if (!localStorage.getItem('spinHistory')) localStorage.setItem('spinHistory', '[]');
            if (!localStorage.getItem('voucherWallet')) localStorage.setItem('voucherWallet', '[]');

            const overlay = document.createElement('div');
            overlay.className = 'lucky-popup-overlay';
            overlay.innerHTML = `
                <div class="lucky-popup-card">
                    <span class="lucky-popup-icon">🎁</span>
                    <h2 class="lucky-popup-title">🎉 CHÚC MỪNG!</h2>
                    <div class="lucky-popup-subtitle">Bạn đã nhận được ${String(spins).padStart(2, '0')} LƯỢT QUAY MAY MẮN</div>
                    <div class="lucky-popup-content" style="text-align: center; font-size: 16px;">
                        Đơn hàng của bạn đạt:<br>
                        <strong style="font-size: 18px; color: #111;">${amount.toLocaleString('vi-VN')}đ</strong><br><br>
                        Bạn đã được tặng:<br>
                        <strong style="font-size: 18px; color: #059669;">🎁 ${spins} Lucky Spin</strong><br><br>
                        Bấm nút bên dưới để quay ngay.
                    </div>
                    <div class="lucky-popup-buttons">
                        <button class="lucky-popup-btn-primary" onclick="window.location.href='/voucher'">Đến vòng quay</button>
                        <button class="lucky-popup-btn-secondary" onclick="closeLuckyPopup(this)">Để sau</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.classList.add('active');
                launchPaymentConfetti();
            }, 100);
        }

        function showNotEligiblePopup(amount) {
            const overlay = document.createElement('div');
            overlay.className = 'lucky-popup-overlay';
            overlay.innerHTML = `
                <div class="lucky-popup-card">
                    <span class="lucky-popup-icon" style="filter: grayscale(1);">ℹ️</span>
                    <h2 class="lucky-popup-title" style="font-size: 24px;">Thông Báo</h2>
                    <p style="color: #4b5563; margin-bottom: 20px; font-size: 15px; line-height: 1.6; text-align: left;">
                        Đơn hàng của bạn chưa đạt điều kiện nhận lượt quay may mắn. Mua thêm để đạt mốc 10.000.000đ.
                    </p>
                    <div class="lucky-popup-content" style="text-align: center;">
                        Giá trị đơn hàng hiện tại: <strong>${amount.toLocaleString('vi-VN')}đ</strong>
                    </div>
                    <div class="lucky-popup-buttons">
                        <button class="lucky-popup-btn-primary" onclick="window.location.href='/Products'">Tiếp tục mua sắm</button>
                        <button class="lucky-popup-btn-secondary" onclick="closeLuckyPopup(this)">Đóng</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.classList.add('active');
            }, 100);
        }

        function closeLuckyPopup(btn) {
            const overlay = btn.closest('.lucky-popup-overlay');
            if (overlay) {
                overlay.classList.remove('active');
                setTimeout(() => overlay.remove(), 300);
            }
        }

        function handleLuckySpinRewards(finalAmount, orderId) {
            let processed = [];
            try {
                processed = JSON.parse(localStorage.getItem('processedOrdersForSpin') || '[]');
            } catch (e) { }

            if (processed.includes(orderId)) {
                console.log('[LuckySpin] Order already processed for spins:', orderId);
                return;
            }

            processed.push(orderId);
            localStorage.setItem('processedOrdersForSpin', JSON.stringify(processed));

            if (finalAmount < 10000000) {
                showNotEligiblePopup(finalAmount);
            } else {
                const spins = Math.floor(finalAmount / 10000000);
                showEligiblePopup(finalAmount, spins);
            }
        }

        // ==========================================
        // ĐỌC TRẠNG THÁI TỪ QUERY PARAMS (VNPay return) VÀ sessionStorage
        // ==========================================
        (function () {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status') || '';     // success | failed | cancelled | invalid | error
            const orderId = params.get('orderId') || sessionStorage.getItem('current_orderId') || '';
            const method = params.get('method') || '';     // COD, MoMo, Visa, ATM, VNPay

            // Lấy thêm từ sessionStorage nếu có
            const storedOrderId = sessionStorage.getItem('current_orderId') || orderId;

            // Map method names
            const methodMap = {
                cod: 'Thanh toán khi nhận hàng (COD)',
                momo: 'Ví điện tử MoMo',
                visa: 'Thẻ Visa / MasterCard',
                atm: 'ATM nội địa',
                vnpay: 'Cổng thanh toán VNPay',
                bank: 'Chuyển khoản ngân hàng',
                qrpay: 'QR Pay (VNPay)',
                sepay: 'Chuyển khoản SePay (QR)'
            };

            const iconEl = document.getElementById('statusIcon');
            const titleEl = document.getElementById('statusTitle');
            const descEl = document.getElementById('statusDesc');
            const orderBox = document.getElementById('orderBox');
            const btnGroup = document.getElementById('btnGroup');
            const badgeEl = document.getElementById('statusBadge');
            const orderIdEl = document.getElementById('orderIdDisplay');
            const methodEl = document.getElementById('methodDisplay');

            // Xác định trạng thái hiển thị
            let iconContent, iconClass, title, desc, badgeClass, badgeText;

            // Nếu không có status param → đây là redirect sau đặt hàng COD/MoMo thành công
            const effectiveStatus = status || (storedOrderId ? 'success' : '');

            switch (effectiveStatus.toLowerCase()) {
                case 'success':
                    iconContent = '✓';
                    iconClass = 'success';
                    title = '🎉 Đặt Hàng Thành Công!';
                    desc = 'Cảm ơn bạn đã mua sắm tại HYPER CORE! Đơn hàng của bạn đã được tiếp nhận và đang được xử lý. Chúng tôi sẽ liên hệ xác nhận sớm.';
                    badgeClass = 'badge-success';
                    badgeText = '✓ Thành công';
                    // Xóa giỏ hàng sau khi đặt thành công
                    localStorage.setItem('hyper_core_cart', '[]');
                    localStorage.setItem('hypercore_cart_items', '[]');
                    sessionStorage.removeItem('checkout_address');
                    sessionStorage.removeItem('checkout_addressId');
                    break;

                case 'cancelled':
                    iconContent = '×';
                    iconClass = 'cancelled';
                    title = 'Giao Dịch Đã Hủy';
                    desc = 'Bạn đã hủy giao dịch thanh toán. Đơn hàng vẫn được giữ lại — bạn có thể thử lại hoặc chọn phương thức thanh toán khác.';
                    badgeClass = 'badge-cancelled';
                    badgeText = '✕ Đã hủy';
                    break;

                case 'expired':
                    iconContent = '⏱';
                    iconClass = 'cancelled';
                    title = 'Phiên Thanh Toán Hết Hạn';
                    desc = 'Thời gian thanh toán đã hết hạn. Vui lòng quay lại và thử thanh toán lại.';
                    badgeClass = 'badge-cancelled';
                    badgeText = '⏱ Hết hạn';
                    break;

                case 'failed':
                case 'error':
                case 'invalid':
                    iconContent = '!';
                    iconClass = 'failed';
                    title = 'Thanh Toán Thất Bại';
                    desc = 'Giao dịch không thành công. Đơn hàng của bạn chưa được xử lý. Vui lòng thử lại hoặc liên hệ hỗ trợ.';
                    badgeClass = 'badge-failed';
                    badgeText = '✕ Thất bại';
                    break;

                default:
                    // Không có status - trạng thái chờ
                    iconContent = '⏳';
                    iconClass = 'loading';
                    title = 'Đang Chờ Xác Nhận';
                    desc = 'Đơn hàng đang chờ xác nhận thanh toán. Chúng tôi sẽ cập nhật trạng thái sớm nhất.';
                    badgeClass = 'badge-pending';
                    badgeText = '⏳ Đang chờ';
            }

            // Render icon
            iconEl.innerHTML = iconContent;
            iconEl.className = `status-icon ${iconClass}`;

            titleEl.textContent = title;
            descEl.textContent = desc;

            // Render order box
            orderBox.style.display = 'block';
            btnGroup.style.display = 'block';

            orderIdEl.textContent = storedOrderId ? `#${storedOrderId}` : '—';

            const displayMethod = method
                ? (methodMap[method.toLowerCase()] || method)
                : 'HYPER CORE';
            methodEl.textContent = displayMethod;

            // Xử lý badge
            badgeEl.className = `status-badge ${badgeClass}`;
            badgeEl.textContent = badgeText;

            // Nếu thành công → hiển thị nút xem trạng thái đơn hàng và xử lý phần thưởng lượt quay may mắn
            if (effectiveStatus.toLowerCase() === 'success') {
                const orderStatusBtn = document.getElementById('orderStatusBtn');
                if (orderStatusBtn) orderStatusBtn.style.display = 'block';

                // --- Xử lý Vòng Quay May Mắn (Lucky Spin Rewards) ---
                injectLuckyPopupStyles();

                let userId = 0;
                try {
                    const userRaw = localStorage.getItem('pc_store_user');
                    if (userRaw) {
                        const user = JSON.parse(userRaw);
                        userId = parseInt(user.userId || '0');
                    }
                } catch (e) {
                    console.error('[LuckySpin] Lỗi parse user:', e);
                }

                const authToken = localStorage.getItem('pc_store_token');

                if (storedOrderId && userId && authToken) {
                    console.log('[LuckySpin] Đơn hàng thành công, đang kiểm tra điều kiện nhận lượt quay cho đơn hàng #' + storedOrderId);
                    fetch(`/api/orders/detail/${storedOrderId}/user/${userId}`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    })
                        .then(res => {
                            if (!res.ok) throw new Error('Không thể tải thông tin đơn hàng');
                            return res.json();
                        })
                        .then(data => {
                            const finalAmount = data.header ? data.header.finalAmount : 0;
                            console.log('[LuckySpin] Giá trị đơn hàng tải từ API:', finalAmount);
                            handleLuckySpinRewards(finalAmount, storedOrderId);
                        })
                        .catch(err => {
                            console.error('[LuckySpin] Lỗi khi truy vấn thông tin đơn hàng:', err);
                        });
                }
            }

            // Nếu thất bại/hủy → đổi text nút
            if (['failed', 'error', 'invalid', 'cancelled', 'expired'].includes(effectiveStatus.toLowerCase())) {
                document.getElementById('shopMoreBtn').textContent = '← Quay lại thanh toán';
                document.getElementById('shopMoreBtn').onclick = () => window.location.href = '/checkout';
            }

            // Nếu có VNPay TxnRef trong URL, hiển thị
            const vnpTxnRef = params.get('vnp_TxnRef') || '';
            if (vnpTxnRef) {
                document.getElementById('txnRow').style.display = 'flex';
                document.getElementById('txnDisplay').textContent = vnpTxnRef;
            }

            // Nếu không có gì → redirect về trang chủ sau 5 giây
            if (!status && !storedOrderId) {
                let countdown = 5;
                const interval = setInterval(() => {
                    countdown--;
                    titleEl.textContent = `Đang chuyển hướng (${countdown}s)...`;
                    if (countdown <= 0) {
                        clearInterval(interval);
                        window.location.href = '/Homepage';
                    }
                }, 1000);
            }
        })();
    </script>

</body>

</html>
