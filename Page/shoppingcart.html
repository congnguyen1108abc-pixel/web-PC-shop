<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYPER CORE - Giỏ Hàng</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, .18), transparent 25%),
                linear-gradient(180deg, #08101b 0%, #020617 100%);
            color: white;
            overflow-x: hidden;
        }

        :root {
            --blue: #38bdf8;
            --blue-light: #7dd3fc;
            --glass: rgba(255, 255, 255, .05);
            --border: rgba(255, 255, 255, .12);
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        .cart-header {
            width: 100%;
            padding: 30px 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, .5);
        }

        .step.active {
            color: white;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .step.active .step-circle {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        }

        /* ========================= */
        /* MAIN */
        /* ========================= */

        .cart-container {
            width: 100%;
            padding: 20px 70px 70px;
            display: grid;
            grid-template-columns: 1.6fr .8fr;
            gap: 30px;
        }

        /* ========================= */
        /* GLASS */
        /* ========================= */

        .glass-box {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 30px;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, .35),
                inset 0 1px 1px rgba(255, 255, 255, .05);
        }

        /* ========================= */
        /* CART ITEM */
        /* ========================= */

        .cart-item {
            display: flex;
            gap: 25px;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            animation: fadeUp .5s ease;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 24px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .variant {
            color: rgba(255, 255, 255, .6);
            margin-bottom: 10px;
        }

        .save-later {
            color: var(--blue-light);
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
            display: inline-block;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .qty-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, .08);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        .qty-btn:hover {
            background: var(--blue);
        }

        .qty-input {
            width: 60px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .05);
            text-align: center;
            color: white;
            font-size: 16px;
        }

        .price-box {
            text-align: right;
        }

        .price {
            font-size: 24px;
            color: var(--blue-light);
            margin-bottom: 18px;
        }

        .delete-btn {
            border: none;
            background: rgba(255, 0, 0, .12);
            color: #ff6b6b;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            cursor: pointer;
            transition: .3s;
        }

        .delete-btn:hover {
            transform: scale(1.08);
        }

        /* ========================= */
        /* SUMMARY */
        /* ========================= */

        .summary-title {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, .75);
        }

        .summary-total {
            font-size: 32px;
            color: var(--blue-light);
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .save-money {
            padding: 16px;
            border-radius: 18px;
            background: rgba(56, 189, 248, .12);
            color: #7dd3fc;
            margin-bottom: 25px;
        }

        .coupon-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .coupon-input {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .05);
            padding: 0 18px;
            color: white;
        }

        .apply-btn {
            padding: 0 22px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .voucher-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .voucher {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            cursor: pointer;
            transition: .3s;
        }

        .voucher:hover {
            background: rgba(56, 189, 248, .15);
            border-color: rgba(125, 211, 252, .25);
        }

        .checkout-btn {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .35s;
        }

        .checkout-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, .35);
        }

        /* ========================= */
        /* SHIPPING */
        /* ========================= */

        .shipping-box {
            margin-top: 25px;
        }

        .shipping-box select {
            width: 100%;
            height: 52px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .05);
            color: white;
            padding: 0 15px;
        }

        /* ========================= */
        /* CROSS SELL */
        /* ========================= */

        .cross-sell {
            margin-top: 40px;
        }

        .cross-title {
            font-size: 34px;
            margin-bottom: 25px;
        }

        .cross-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .cross-card {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 28px;
            overflow: hidden;
            transition: .4s;
        }

        .cross-card:hover {
            transform: translateY(-8px);
        }

        .cross-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .cross-info {
            padding: 20px;
        }

        .cross-info h3 {
            margin-bottom: 10px;
        }

        .cross-price {
            color: var(--blue-light);
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .add-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: rgba(56, 189, 248, .15);
            color: #7dd3fc;
            cursor: pointer;
            transition: .3s;
        }

        .add-btn:hover {
            background: var(--blue);
            color: white;
        }

        /* ========================= */
        /* UNDO */
        /* ========================= */

        .undo-box {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 23, 42, .92);
            border: 1px solid rgba(255, 255, 255, .12);
            padding: 18px 24px;
            border-radius: 20px;
            display: none;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(20px);
        }

        .undo-btn {
            border: none;
            background: var(--blue);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        /* ========================= */
        /* ANIMATION */
        /* ========================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================= */
        /* RESPONSIVE */
        /* ========================= */

        @media(max-width:1000px) {

            .cart-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .cross-grid {
                grid-template-columns: 1fr;
            }

            .cart-header {
                padding: 25px 20px;
                flex-direction: column;
                gap: 20px;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="cart-header">

        <div class="logo" style="cursor: pointer;" onclick="window.location.href='/Homepage'">
            HYPER CORE
        </div>

        <div class="progress">

            <div class="step active">
                <div class="step-circle">1</div>
                <span>Giỏ hàng</span>
            </div>

            <div class="step">
                <div class="step-circle">2</div>
                <span>Địa chỉ</span>
            </div>

            <div class="step">
                <div class="step-circle">3</div>
                <span>Thanh toán</span>
            </div>

            <div class="step">
                <div class="step-circle">4</div>
                <span>Hoàn tất</span>
            </div>

        </div>

    </div>

    <!-- MAIN -->

    <div class="cart-container">

        <!-- LEFT -->

        <div class="glass-box" id="cartItemsContainer">

            <!-- Dynamic Items will be rendered here by JS -->

        </div>

        <!-- RIGHT -->

        <div class="glass-box">

            <h2 class="summary-title">
                Tóm Tắt Đơn Hàng
            </h2>

            <div class="save-money">
                Bạn đã tiết kiệm được 4.200.000đ 🎉
            </div>

            <div class="voucher-list">

                <div class="voucher">SALE10</div>
                <div class="voucher">FREESHIP</div>
                <div class="voucher">VIP2026</div>

            </div>

            <div class="coupon-box">

                <input type="text" class="coupon-input" placeholder="Nhập mã giảm giá">

                <button class="apply-btn">
                    Áp dụng
                </button>

            </div>



            <div style="margin-top:30px">

                <div class="summary-row">
                    <span>Tạm tính</span>
                    <span id="subtotal">63.280.000đ</span>
                </div>

                <div class="summary-row">
                    <span>Phí vận chuyển</span>
                    <span>40.000đ</span>
                </div>

                <div class="summary-row">
                    <span>Giảm giá</span>
                    <span>-1.000.000đ</span>
                </div>

                <div class="summary-total" id="total">
                    62.320.000đ
                </div>

            </div>

            <button class="checkout-btn">
                Thanh Toán
            </button>

        </div>

    </div>

    <!-- CROSS SELL -->

    <div class="cross-sell">

        <div style="padding:0 70px">

            <h2 class="cross-title">
                Thường Được Mua Cùng
            </h2>

            <div class="cross-grid" id="crossGridContainer">
                <!-- Dynamic Recommendations will be rendered here by JS -->
            </div>

        </div>

    </div>

    <!-- UNDO -->

    <div class="undo-box" id="undoBox">

        <span>Đã xóa sản phẩm</span>

        <button class="undo-btn" id="undoBtn">
            Hoàn tác
        </button>

    </div>

    <!-- SCRIPT -->

    <script>
        let cart = JSON.parse(localStorage.getItem('hyper_core_cart')) || [];
        if (localStorage.getItem('hyper_core_cart') === null) {
            cart = [{
                id: 999,
                name: "Beast X Pro Magnesium Gaming Mouse",
                specs: "Black · OMRON Opticals · Side Slits",
                price: 145.00,
                currency: "USD",
                qty: 1,
                img: "https://placehold.co/100x100/0f172a/7dd3fc?text=Beast+X"
            }];
            localStorage.setItem('hyper_core_cart', JSON.stringify(cart));
        }
        
        const subtotal = document.getElementById("subtotal");
        const total = document.getElementById("total");

        function renderCartPage() {
            const container = document.getElementById('cartItemsContainer');
            if (!container) return;
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px;">
                        <div style="font-size: 64px; margin-bottom: 20px;">🛒</div>
                        <h2 style="font-size: 28px; margin-bottom: 12px; color: white;">Giỏ hàng trống</h2>
                        <p style="color: rgba(255,255,255,0.6); margin-bottom: 30px;">Bạn chưa thêm sản phẩm nào vào giỏ hàng.</p>
                        <button class="checkout-btn" onclick="window.location.href='/Products'" style="width: auto; padding: 0 40px;">Tiếp tục mua sắm</button>
                    </div>
                `;
                subtotal.innerText = '0đ';
                total.innerText = '0đ';
                
                const savingsEl = document.querySelector('.save-money');
                if (savingsEl) savingsEl.style.display = 'none';
                return;
            }
            
            container.innerHTML = '';
            let sum = 0;
            
            cart.forEach(item => {
                let itemPriceVnd = item.currency === 'USD' ? item.price * 25000 : item.price;
                sum += itemPriceVnd * item.qty;
                
                const formattedPrice = item.currency === 'USD' 
                  ? `$${item.price.toFixed(2)} USD` 
                  : item.price.toLocaleString('vi-VN') + ' đ';
                  
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="item-info">
                        <h3 style="color: white; margin-bottom: 12px; font-size: 28px;">${item.name}</h3>
                        <div class="variant" style="color: rgba(255,255,255,0.6); margin-bottom: 10px;">${item.specs}</div>
                        <div class="quantity-box" style="display:flex; align-items:center; gap:12px; margin-top:18px;">
                            <button class="qty-btn" onclick="changePageQty(${item.id}, -1)">-</button>
                            <input type="number" class="qty-input" value="${item.qty}" readonly style="width: 60px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); text-align: center; color: white; font-size: 16px;">
                            <button class="qty-btn" onclick="changePageQty(${item.id}, 1)">+</button>
                        </div>
                        <div class="save-later" style="color: #7dd3fc; cursor: pointer; font-size: 14px; margin-top: 12px; display: inline-block;">💙 Lưu mua sau</div>
                    </div>
                    <div class="price-box" style="text-align: right;">
                        <div class="price item-price" data-price="${itemPriceVnd}" style="font-size: 24px; color: #7dd3fc; margin-bottom: 18px;">${formattedPrice}</div>
                        <button class="delete-btn" onclick="removePageItem(${item.id})" style="border: none; background: rgba(255,0,0,0.12); color: #ff6b6b; width: 42px; height: 42px; border-radius: 14px; cursor: pointer; transition: 0.3s;">🗑</button>
                    </div>
                `;
                container.appendChild(itemEl);
            });
            
            subtotal.innerText = sum.toLocaleString('vi-VN') + ' đ';
            
            let discount = sum > 1000000 ? 1000000 : 0;
            let shipping = 40000;
            let finalTotal = Math.max(0, sum - discount + shipping);
            
            total.innerText = finalTotal.toLocaleString('vi-VN') + ' đ';
            
            const savingsEl = document.querySelector('.save-money');
            if (savingsEl) {
                if (discount > 0) {
                    savingsEl.style.display = 'block';
                    savingsEl.innerText = `Bạn đã tiết kiệm được ${discount.toLocaleString('vi-VN')} đ 🎉`;
                } else {
                    savingsEl.style.display = 'none';
                }
            }
            renderPageRecommendations();
        }

        const RECOMMEND_PRODUCTS = [
          {
            id: 4,
            name: "Corsair Dominator DDR5 32GB",
            specs: "DDR5 · 32GB (2x16) · 6400MHz",
            price: 4800000,
            oldPrice: 5500000,
            currency: "VND",
            img: "https://placehold.co/300x200/081120/7dd3fc?text=DDR5+32GB"
          },
          {
            id: 5,
            name: "Samsung 990 Pro NVMe 2TB",
            specs: "PCIe 4.0 · 7450 MB/s · M.2 2280",
            price: 3200000,
            oldPrice: 3800000,
            currency: "VND",
            img: "https://placehold.co/300x200/081120/7dd3fc?text=Samsung+990+Pro"
          },
          {
            id: 12,
            name: "Corsair Vengeance DDR5 64GB",
            specs: "DDR5 · 64GB (2x32) · 5600MHz",
            price: 7200000,
            oldPrice: 8500000,
            currency: "VND",
            img: "https://placehold.co/300x200/081120/7dd3fc?text=Vengeance+64GB"
          }
        ];

        function renderPageRecommendations() {
            const grid = document.getElementById("crossGridContainer");
            const crossSellSection = document.querySelector(".cross-sell");
            if (!grid) return;

            // Filter out items already in the cart
            const visibleRecs = RECOMMEND_PRODUCTS.filter(rec => !cart.some(item => item.id === rec.id));

            if (visibleRecs.length === 0) {
                if (crossSellSection) crossSellSection.style.display = 'none';
                return;
            }
            if (crossSellSection) crossSellSection.style.display = 'block';

            grid.innerHTML = '';
            visibleRecs.forEach(rec => {
                const discount = rec.oldPrice ? Math.round((1 - rec.price / rec.oldPrice) * 100) : 0;
                const formattedPrice = rec.price.toLocaleString('vi-VN') + ' đ';
                const formattedOldPrice = rec.oldPrice ? rec.oldPrice.toLocaleString('vi-VN') + ' đ' : '';

                const card = document.createElement("div");
                card.className = "cross-card";
                card.innerHTML = `
                    <img src="${rec.img}" alt="${rec.name}">
                    <div class="cross-info">
                        <h3 style="font-size: 20px; color: white; margin-bottom: 8px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${rec.name}</h3>
                        <p style="color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 12px; height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${rec.specs}</p>
                        <div class="cross-price" style="font-size: 18px; font-weight: bold; color: #7dd3fc; margin-bottom: 15px;">
                            ${formattedPrice}
                            ${formattedOldPrice ? `<span style="text-decoration: line-through; color: rgba(255,255,255,0.4); font-size: 13px; margin-left: 8px;">${formattedOldPrice}</span>` : ''}
                        </div>
                        <button class="add-btn" onclick="addPageRecommendedItem(${rec.id})" style="width: 100%; height: 46px; border: none; border-radius: 14px; background: rgba(56, 189, 248, 0.15); color: #7dd3fc; cursor: pointer; transition: 0.3s;">Thêm vào giỏ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.addPageRecommendedItem = function(id) {
            const rec = RECOMMEND_PRODUCTS.find(r => r.id === id);
            if (rec) {
                const existing = cart.find(i => i.id === rec.id);
                if (existing) {
                    existing.qty++;
                } else {
                    cart.push({
                        id: rec.id,
                        name: rec.name,
                        specs: rec.specs,
                        price: rec.price,
                        currency: rec.currency,
                        qty: 1,
                        img: rec.img
                    });
                }
                localStorage.setItem('hyper_core_cart', JSON.stringify(cart));
                renderCartPage();
            }
        };

        window.changePageQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                localStorage.setItem('hyper_core_cart', JSON.stringify(cart));
                renderCartPage();
            }
        };
        
        window.removePageItem = function(id) {
            cart = cart.filter(i => i.id !== id);
            localStorage.setItem('hyper_core_cart', JSON.stringify(cart));
            renderCartPage();
        };

        // Apply Voucher Code handlers
        document.querySelectorAll(".voucher").forEach(el => {
            el.addEventListener("click", () => {
                document.querySelector(".coupon-input").value = el.innerText;
            });
        });

        // Redirect to filladdress page on clicking Checkout
        const checkoutBtn = document.querySelector(".checkout-btn");
        if (checkoutBtn) {
            checkoutBtn.addEventListener("click", () => {
                if (cart.length === 0) return;
                
                let sum = 0;
                cart.forEach(item => {
                    let itemPriceVnd = item.currency === 'USD' ? item.price * 25000 : item.price;
                    sum += itemPriceVnd * item.qty;
                });
                let discount = sum > 1000000 ? 1000000 : 0;
                let shipping = 40000;
                let finalTotal = Math.max(0, sum - discount + shipping);

                let cartData = {
                    items: [],
                    subtotal: sum,
                    shipping: shipping,
                    discount: discount,
                    total: finalTotal
                };
 
                cart.forEach(item => {
                    let itemPriceVnd = item.currency === 'USD' ? item.price * 25000 : item.price;
                    cartData.items.push({ 
                        img: item.img, 
                        title: item.name, 
                        variant: item.specs, 
                        price: itemPriceVnd, 
                        qty: item.qty 
                    });
                });
 
                localStorage.setItem("hypercore_cart", JSON.stringify(cartData));
                window.location.href = "/filladdress";
            });
        }

        // Initial render on load
        renderCartPage();
    </script>

</body>

</html>
