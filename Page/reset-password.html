<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt Lại Mật Khẩu - HYPER CORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .widget-popup {
            position: relative;
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .widget-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .widget-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            color: #000000;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-close:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: rotate(90deg);
        }

        .widget-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .widget-title {
            font-size: 32px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
            text-align: center;
        }

        .widget-subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .widget-input {
            width: 100%;
            height: 52px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }

        .widget-input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        }

        .widget-submit {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #000000;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .widget-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .widget-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .back-link a {
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: 0.3s;
        }

        .back-link a:hover {
            color: #333333;
            text-decoration: underline;
        }

        /* Error Banner */
        .error-banner {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            color: #dc2626;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-banner.show {
            display: flex;
        }

        /* Password strength indicator */
        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-bottom: 8px;
            overflow: hidden;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-weak {
            width: 33%;
            background: #ef4444;
        }

        .strength-medium {
            width: 66%;
            background: #f59e0b;
        }

        .strength-strong {
            width: 100%;
            background: #22c55e;
        }

        .password-hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
            display: none;
        }

        .password-hint.show {
            display: block;
        }

        /* Loading spinner */
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .widget-submit.loading .btn-spinner {
            display: block;
        }

        .widget-submit.loading .btn-text {
            display: none;
        }

        /* Success Popup */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 48px 40px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
        }

        .success-overlay.active .success-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .success-icon-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: ringPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
        }

        @keyframes ringPop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .success-icon-ring svg {
            width: 44px;
            height: 44px;
            color: #ffffff;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawTick 0.5s ease 0.4s forwards;
        }

        @keyframes drawTick {
            to { stroke-dashoffset: 0; }
        }

        .success-title {
            font-size: 22px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 8px;
        }

        .success-subtitle {
            font-size: 14px;
            color: #666666;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .success-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #000000;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .success-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        @media(max-width: 600px) {
            .widget-box {
                padding: 30px 24px;
            }
            .widget-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <!-- SUCCESS POPUP -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-card">
            <div class="success-icon-ring">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <div class="success-title">Đổi Mật Khẩu Thành Công!</div>
            <div class="success-subtitle">
                Mật khẩu của bạn đã được cập nhật.<br>
                Bạn có thể đăng nhập ngay với mật khẩu mới.
            </div>
            <button class="success-btn" onclick="window.location.href='/Login'">Đăng Nhập Ngay</button>
        </div>
    </div>

    <div class="widget-popup" id="resetPopup">
        <div class="widget-box">
            <button class="widget-close" onclick="window.location.href='/Login'">✕</button>

            <div class="widget-icon">🔑</div>
            <h2 class="widget-title">Đặt Lại Mật Khẩu</h2>
            <p class="widget-subtitle" id="subtitle">
                Nhập mật khẩu mới cho tài khoản của bạn.
            </p>

            <!-- ERROR BANNER -->
            <div class="error-banner" id="errorBanner">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="errorMsg">Có lỗi xảy ra</span>
            </div>

            <form id="resetForm" onsubmit="return handleResetPassword(event)">
                <input type="password" id="newPassword" class="widget-input" placeholder="Mật khẩu mới (ít nhất 6 ký tự)" required minlength="6" />
                
                <!-- Password strength indicator -->
                <div class="password-strength" id="strengthBar">
                    <div class="password-strength-bar" id="strengthFill"></div>
                </div>
                <div class="password-hint" id="strengthText">Mật khẩu yếu</div>

                <input type="password" id="confirmPassword" class="widget-input" placeholder="Xác nhận mật khẩu mới" required />

                <button type="submit" class="widget-submit" id="submitBtn">
                    <div class="btn-spinner"></div>
                    <span class="btn-text">Đặt Lại Mật Khẩu</span>
                </button>
            </form>

            <div class="back-link">
                Nhớ mật khẩu?
                <a href="/Login">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const API_BASE = '';
        let resetToken = '';

        // Get token from URL
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            resetToken = urlParams.get('token');

            if (!resetToken) {
                showError('Link đặt lại mật khẩu không hợp lệ. Vui lòng kiểm tra email của bạn.');
                document.getElementById('resetForm').style.display = 'none';
                return;
            }

            // Verify token
            await verifyToken(resetToken);
        });

        async function verifyToken(token) {
            try {
                const response = await fetch(`${API_BASE}/api/auth/verify-reset-token?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (!response.ok || !data.isValid) {
                    showError(data.message || 'Link đã hết hạn hoặc không hợp lệ. Vui lòng yêu cầu link mới.');
                    document.getElementById('resetForm').style.display = 'none';
                    return;
                }

                // Update subtitle with email
                if (data.email) {
                    document.getElementById('subtitle').textContent = `Đặt lại mật khẩu cho: ${data.email}`;
                }

            } catch (err) {
                console.error('Error verifying token:', err);
                showError('Không thể xác thực link. Vui lòng thử lại sau.');
                document.getElementById('resetForm').style.display = 'none';
            }
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            document.getElementById('errorMsg').textContent = msg;
            banner.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorBanner').classList.remove('show');
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('submitBtn');
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function showSuccess() {
            document.getElementById('successOverlay').classList.add('active');
            // Auto redirect after 3 seconds
            setTimeout(() => window.location.href = '/Login', 3000);
        }

        // Password strength checker
        document.getElementById('newPassword').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');

            if (password.length === 0) {
                strengthBar.classList.remove('show');
                strengthText.classList.remove('show');
                return;
            }

            strengthBar.classList.add('show');
            strengthText.classList.add('show');

            // Calculate strength
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            // Update UI
            strengthFill.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthFill.classList.add('strength-weak');
                strengthText.textContent = 'Mật khẩu yếu';
                strengthText.style.color = '#ef4444';
            } else if (strength <= 3) {
                strengthFill.classList.add('strength-medium');
                strengthText.textContent = 'Mật khẩu trung bình';
                strengthText.style.color = '#f59e0b';
            } else {
                strengthFill.classList.add('strength-strong');
                strengthText.textContent = 'Mật khẩu mạnh';
                strengthText.style.color = '#22c55e';
            }
        });

        // Hash password using SHA256
        function hashPassword(password) {
            return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            hideError();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (newPassword.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự!');
                return false;
            }

            if (newPassword !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp!');
                return false;
            }

            setLoading(true);

            try {
                // Hash password
                const passwordHash = hashPassword(newPassword);

                const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        resetToken: resetToken,
                        newPasswordHash: passwordHash
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Không thể đặt lại mật khẩu. Token có thể đã hết hạn.');
                    setLoading(false);
                    return false;
                }

                // Success
                setLoading(false);
                showSuccess();

            } catch (err) {
                console.error('Error:', err);
                showError('Không thể kết nối máy chủ. Vui lòng thử lại sau.');
                setLoading(false);
            }

            return false;
        }
    </script>
</body>
</html>
