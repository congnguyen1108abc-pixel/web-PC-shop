<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Địa Chỉ Giao Hàng - HYPER CORE</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --blue: #38bdf8;
            --blue-light: #7dd3fc;
            --dark: #ffffff;
            --dark2: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --text: #4b5563;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            overflow-x: hidden;
            color: #111827;
        }

        /* BACKGROUND */

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .22;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            background: #f3f4f6;
            top: -120px;
            left: -120px;
        }

        .orb2 {
            width: 380px;
            height: 380px;
            background: #e5e7eb;
            right: -100px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* CONTAINER */

        .shipping-wrapper {
            width: 100%;
            min-height: auto;
            padding: 40px 20px 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shipping-box {
            width: 100%;
            max-width: 950px;
            background: var(--glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .shipping-box::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 50%;
            filter: blur(80px);
            top: -120px;
            right: -120px;
        }

        .shipping-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #111827;
        }

        .shipping-subtitle {
            color: var(--text);
            margin-bottom: 45px;
            line-height: 1.8;
        }

        /* FORM */

        .form-section {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 25px;
            color: #111827;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 12px;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }

        .required {
            color: #111827;
        }

        .input-field,
        .select-field,
        .textarea-field {
            width: 100%;
            border: 1px solid #d1d5db;
            background: #f3f4f6;
            border-radius: 18px;
            padding: 16px 18px;
            color: #111827;
            outline: none;
            transition: .3s;
            backdrop-filter: blur(12px);
            font-size: 15px;
        }

        .input-field {
            height: 58px;
        }

        .select-field {
            height: 58px;
            cursor: pointer;
        }

        .textarea-field {
            min-height: 130px;
            resize: none;
        }

        .input-field:focus,
        .select-field:focus,
        .textarea-field:focus {
            border-color: #111827;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        .input-field::placeholder,
        .textarea-field::placeholder {
            color: #9ca3af;
        }

        select option {
            background: #ffffff;
            color: #111827;
        }

        /* ADDRESS TYPE */

        .address-type {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .type-card {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .type-card input {
            display: none;
        }

        .type-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            border-radius: 22px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            cursor: pointer;
            transition: .35s;
        }

        .type-label:hover {
            transform: translateY(-4px);
            background: #e5e7eb;
        }

        .type-card input:checked+.type-label {
            border-color: #111827;
            background: #e5e7eb;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .type-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-size: 22px;
        }

        .type-text h4 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .type-text p {
            font-size: 13px;
            color: var(--text);
        }

        /* CHECKBOX */

        .checkbox-box {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #374151;
        }

        .checkbox-box input {
            width: 18px;
            height: 18px;
            accent-color: #000000;
        }

        /* BUTTONS */

        .action-buttons {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .back-btn,
        .submit-btn {
            height: 58px;
            padding: 0 34px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: .35s;
        }

        .back-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
            backdrop-filter: blur(20px);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background: #f3f4f6;
        }

        .submit-btn {
            background: #000000;
            color: white;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
        }

        /* RESPONSIVE */

        @media(max-width:768px) {

            .shipping-box {
                padding: 30px 22px;
            }

            .shipping-title {
                font-size: 34px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .back-btn,
            .submit-btn {
                width: 100%;
            }
        }

        /* ================================= */
        /* HEADER */
        /* ================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            transform: none;
            width: 100%;
            height: 78px;
            padding: 0 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            border-radius: 0 0 20px 20px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            transition: .4s ease;
        }

        header, header * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
        }

        header.scrolled {
            background: #FFFFFF;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #000000;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 15px;
            position: relative;
            transition: .3s;
            display: flex;
            align-items: center;
        }

        nav a:hover {
            color: #000000;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -7px;
            width: 0%;
            height: 2px;
            border-radius: 10px;
            background: #555555;
            transition: .3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ================================= */
        /* HEADER ACTIONS */
        /* ================================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-btn {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, .12);
            background: rgba(0, 0, 0, .06);
            backdrop-filter: blur(20px);
            color: #000000;
            cursor: pointer;
            font-size: 18px;
            transition: .35s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, .12);
        }

        .login-glass-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, .14);
            background: rgba(0, 0, 0, .08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: background .35s ease, border .35s ease, transform .35s ease, box-shadow .35s ease;
        }

        .login-glass-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg, transparent, #555555, transparent);
            transform: skewX(-20deg);
            transition: .7s;
        }

        .login-glass-btn:hover::before {
            left: 140%;
        }

        .login-glass-btn:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, .95), rgba(14, 165, 233, .95));
            border: 1px solid rgba(125, 211, 252, .6);
            box-shadow: 0 10px 30px rgba(56, 189, 248, .35), 0 0 20px rgba(125, 211, 252, .25);
            transform: translateY(-3px);
            color: #FFFFFF;
        }

        .login-icon {
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-glass-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, .3);
            background: linear-gradient(135deg, rgba(0, 0, 0, .1), rgba(0, 0, 0, .2));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: .35s ease;
        }

        .register-glass-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(0, 0, 0, .25), transparent);
            transform: skewX(-20deg);
            transition: .7s;
        }

        .register-glass-btn:hover::before {
            left: 140%;
        }

        .register-glass-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            color: #000000;
        }

        /* ========================= */
        /* CHECKOUT PROGRESS */
        /* ========================= */

        .checkout-progress-wrapper {
            margin-top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 70px 10px;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(0, 0, 0, .5);
            font-weight: 600;
        }

        .step.active {
            color: #000000;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .05);
            border: 1px solid rgba(0, 0, 0, .1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .step.active .step-circle {
            background: #000000;
            color: #ffffff;
        }
    </style>

</head>

    <script>
        // =========================
        // LOAD ALL PROVINCES (API)
        // =========================
        const citySelect = document.getElementById("citySelect");
        const districtSelect = document.getElementById("districtSelect");
        const wardSelect = document.getElementById("wardSelect");

        let citiesLoadedResolve;
        const citiesLoadedPromise = new Promise((resolve) => {
            citiesLoadedResolve = resolve;
        });

        async function loadCities() {
            try {
                citySelect.innerHTML = '<option value="">Đang tải danh sách tỉnh thành...</option>';
                const response = await fetch("https://provinces.open-api.vn/api/p/");
                const cities = await response.json();

                citySelect.innerHTML = '<option value="">--- Chọn Tỉnh / Thành phố ---</option>';
                cities.forEach(city => {
                    const option = document.createElement("option");
                    option.value = city.name;
                    option.dataset.code = city.code;
                    option.textContent = city.name;
                    citySelect.appendChild(option);
                });

                // Auto select "Thành phố Hồ Chí Minh" as default
                const defaultCity = [...citySelect.options]
                    .find(option => option.textContent.includes("Hồ Chí Minh"));
                if (defaultCity) {
                    defaultCity.selected = true;
                    citySelect.dispatchEvent(new Event("change"));
                }
            } catch (error) {
                console.error("Lỗi tải tỉnh thành:", error);
                citySelect.innerHTML = '<option value="">Lỗi tải dữ liệu tỉnh thành</option>';
            } finally {
                if (typeof citiesLoadedResolve === 'function') {
                    citiesLoadedResolve();
                }
            }
        }

        // =========================
        // LOAD DISTRICTS
        // =========================
        citySelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const cityCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            districtSelect.disabled = true;
            wardSelect.disabled = true;

            if (!cityCode) return;

            try {
                districtSelect.disabled = true;
                districtSelect.innerHTML = '<option value="">Đang tải quận huyện...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/p/${cityCode}?depth=2`);
                const data = await response.json();

                districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
                data.districts.forEach(district => {
                    const option = document.createElement("option");
                    option.value = district.name;
                    option.dataset.code = district.code;
                    option.textContent = district.name;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải quận huyện:", error);
                districtSelect.innerHTML = '<option value="">Lỗi tải dữ liệu quận huyện</option>';
            }
        });

        // =========================
        // LOAD WARDS
        // =========================
        districtSelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const districtCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            wardSelect.disabled = true;

            if (!districtCode) return;

            try {
                wardSelect.disabled = true;
                wardSelect.innerHTML = '<option value="">Đang tải phường xã...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/d/${districtCode}?depth=2`);
                const data = await response.json();

                wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
                data.wards.forEach(ward => {
                    const option = document.createElement("option");
                    option.value = ward.name;
                    option.textContent = ward.name;
                    wardSelect.appendChild(option);
                });
                wardSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải phường xã:", error);
                wardSelect.innerHTML = '<option value="">Lỗi tải dữ liệu phường xã</option>';
            }
        });

        // Initialize loading of cities
        loadCities();

        // =========================
        // AUTHENTICATION & API HELPERS
        // =========================
        
        /**
         * Clear authentication data from localStorage and redirect to login page
         */
        function clearAuthAndRedirect() {
            localStorage.removeItem('pc_store_token');
            localStorage.removeItem('pc_store_refresh_token');
            localStorage.removeItem('pc_store_user');
            localStorage.removeItem('hyper_core_cart');
            localStorage.removeItem('hypercore_cart_items');
            localStorage.removeItem('hypercore_cart');
            localStorage.removeItem('shippingAddress');
            sessionStorage.removeItem('checkout_addressId');
            sessionStorage.removeItem('checkout_address');
            sessionStorage.removeItem('current_orderId');
            window.location.href = '/Login';
        }

        /**
         * Fetch user addresses from API
         * @param {number} userId - The user ID to fetch addresses for
         * @returns {Promise<Array|null>} - Array of address objects, empty array on error, null on auth failure
         */
        async function fetchUserAddresses(userId) {
            const token = localStorage.getItem('pc_store_token');
            
            try {
                const response = await fetch(`/api/users/addresses/${userId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                // Handle 401 Unauthorized - redirect to login
                if (response.status === 401) {
                    clearAuthAndRedirect();
                    return null;
                }
                
                // Handle other errors - log and return empty array
                if (!response.ok) {
                    console.error('Error fetching addresses:', response.status);
                    return [];
                }
                
                // Parse and return address array
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }

        // =========================
        // HELPER: Extract Form Data
        // =========================
        /**
         * Extract and structure form data for API submission
         * @param {number} userId - The user ID from authentication
         * @returns {Object} Address data object ready for API POST request
         */
        function extractFormData(userId) {
            return {
                userId: userId,
                receiverName: document.getElementById('fullName').value.trim(),
                phoneNumber: document.getElementById('phoneNumber').value.trim(),
                province: document.getElementById('citySelect').value,
                district: document.getElementById('districtSelect').value,
                ward: document.getElementById('wardSelect').value,
                detailAddress: document.getElementById('streetAddress').value.trim(),
                isDefault: document.getElementById('defaultAddress').checked
            };
        }

        // =========================
        // HELPER: Dropdown Selection Functions
        // =========================
        
        /**
         * Select province in dropdown and trigger district load
         * @param {string} provinceName - The province name to select
         * @returns {Promise<boolean>} - True if province was found and selected, false otherwise
         */
        async function selectProvince(provinceName) {
            if (!provinceName) {
                console.warn('selectProvince: No province name provided');
                return false;
            }

            const citySelect = document.getElementById('citySelect');
            if (!citySelect) {
                console.error('selectProvince: citySelect element not found');
                return false;
            }

            // Find matching option (case-insensitive)
            const provinceNameLower = provinceName.toLowerCase().trim();
            const options = Array.from(citySelect.options);
            const matchingOption = options.find(opt => 
                opt.value && opt.value.toLowerCase().trim() === provinceNameLower
            );

            if (!matchingOption) {
                console.warn(`selectProvince: Province "${provinceName}" not found in dropdown`);
                return false;
            }

            // Select the option
            matchingOption.selected = true;

            // Trigger change event to load districts
            const changeEvent = new Event('change', { bubbles: true });
            citySelect.dispatchEvent(changeEvent);

            // Wait for districts to load (the change event handler is async)
            // We'll wait for the districtSelect to be enabled and populated
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    const districtSelect = document.getElementById('districtSelect');
                    // District loaded when it's enabled and has more than just the placeholder option
                    if (districtSelect && !districtSelect.disabled && districtSelect.options.length > 1) {
                        clearInterval(checkInterval);
                        resolve(true);
                    }
                }, 100);

                // Timeout after 5 seconds
                setTimeout(() => {
                    clearInterval(checkInterval);
                    console.warn('selectProvince: Timeout waiting for districts to load');
                    resolve(false);
                }, 5000);
            });
        }

        /**
         * Select district in dropdown and trigger ward load
         * @param {string} districtName - The district name to select
         * @returns {Promise<boolean>} - True if district was found and selected, false otherwise
         */
        async function selectDistrict(districtName) {
            if (!districtName) {
                console.warn('selectDistrict: No district name provided');
                return false;
            }

            const districtSelect = document.getElementById('districtSelect');
            if (!districtSelect) {
                console.error('selectDistrict: districtSelect element not found');
                return false;
            }

            // Check if district dropdown is disabled (province not selected yet)
            if (districtSelect.disabled) {
                console.warn('selectDistrict: District dropdown is disabled. Select province first.');
                return false;
            }

            // Find matching option (case-insensitive)
            const districtNameLower = districtName.toLowerCase().trim();
            const options = Array.from(districtSelect.options);
            const matchingOption = options.find(opt => 
                opt.value && opt.value.toLowerCase().trim() === districtNameLower
            );

            if (!matchingOption) {
                console.warn(`selectDistrict: District "${districtName}" not found in dropdown`);
                return false;
            }

            // Select the option
            matchingOption.selected = true;

            // Trigger change event to load wards
            const changeEvent = new Event('change', { bubbles: true });
            districtSelect.dispatchEvent(changeEvent);

            // Wait for wards to load
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    const wardSelect = document.getElementById('wardSelect');
                    // Ward loaded when it's enabled and has more than just the placeholder option
                    if (wardSelect && !wardSelect.disabled && wardSelect.options.length > 1) {
                        clearInterval(checkInterval);
                        resolve(true);
                    }
                }, 100);

                // Timeout after 5 seconds
                setTimeout(() => {
                    clearInterval(checkInterval);
                    console.warn('selectDistrict: Timeout waiting for wards to load');
                    resolve(false);
                }, 5000);
            });
        }

        /**
         * Select ward in dropdown
         * @param {string} wardName - The ward name to select
         * @returns {boolean} - True if ward was found and selected, false otherwise
         */
        function selectWard(wardName) {
            if (!wardName) {
                console.warn('selectWard: No ward name provided');
                return false;
            }

            const wardSelect = document.getElementById('wardSelect');
            if (!wardSelect) {
                console.error('selectWard: wardSelect element not found');
                return false;
            }

            // Check if ward dropdown is disabled (district not selected yet)
            if (wardSelect.disabled) {
                console.warn('selectWard: Ward dropdown is disabled. Select district first.');
                return false;
            }

            // Find matching option (case-insensitive)
            const wardNameLower = wardName.toLowerCase().trim();
            const options = Array.from(wardSelect.options);
            const matchingOption = options.find(opt => 
                opt.value && opt.value.toLowerCase().trim() === wardNameLower
            );

            if (!matchingOption) {
                console.warn(`selectWard: Ward "${wardName}" not found in dropdown`);
                return false;
            }

            // Select the option
            matchingOption.selected = true;

            // Trigger change event (for any listeners that might be attached)
            const changeEvent = new Event('change', { bubbles: true });
            wardSelect.dispatchEvent(changeEvent);

            return true;
        }

        // =========================
        // FORM VALIDATION
        // =========================
        
        /**
         * Validate all form fields before submission
         * Shows specific alert messages for each validation failure
         * @returns {boolean} - True if all validations pass, false otherwise
         */
        function validateForm() {
            // Get form field values
            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const province = document.getElementById('citySelect').value;
            const district = document.getElementById('districtSelect').value;
            const ward = document.getElementById('wardSelect').value;
            const streetAddress = document.getElementById('streetAddress').value.trim();
            
            // Validate fullName is not empty after trim
            if (!fullName) {
                alert('Vui lòng nhập họ tên!');
                return false;
            }
            
            // Validate phoneNumber matches regex pattern "^0[0-9]{9}$"
            const phoneRegex = /^0[0-9]{9}$/;
            if (!phoneNumber || !phoneRegex.test(phoneNumber)) {
                alert('Số điện thoại không hợp lệ! (Phải là 10 số, bắt đầu bằng 0)');
                return false;
            }
            
            // Validate province, district, ward dropdowns all have non-empty values
            if (!province || !district || !ward) {
                alert('Vui lòng chọn đầy đủ Tỉnh/Thành, Quận/Huyện, Phường/Xã!');
                return false;
            }
            
            // Validate streetAddress is not empty after trim
            if (!streetAddress) {
                alert('Vui lòng nhập số nhà, tên đường!');
                return false;
            }
            
            // All validations passed
            return true;
        }

        /**
         * Save address to database via REST API
         * @param {Object} addressData - Address data object with userId, receiverName, phoneNumber, province, district, ward, detailAddress, isDefault
         * @returns {Promise<Object>} - Object with success flag and data/error message
         */
        async function saveAddress(addressData) {
            const token = localStorage.getItem('pc_store_token');
            
            try {
                const response = await fetch('/api/users/addresses', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(addressData)
                });
                
                // Handle 401 Unauthorized - redirect to login
                if (response.status === 401) {
                    clearAuthAndRedirect();
                    return { success: false, error: 'Unauthorized' };
                }
                
                // Handle 400 Bad Request - return error message
                if (response.status === 400) {
                    const errorData = await response.json();
                    return { 
                        success: false, 
                        error: errorData.message || 'Dữ liệu không hợp lệ' 
                    };
                }
                
                // Handle other 4xx/5xx errors - return error message
                if (!response.ok) {
                    const errorData = await response.json();
                    return { 
                        success: false, 
                        error: errorData.message || `Lỗi: ${response.status}` 
                    };
                }
                
                // Success - return data
                const result = await response.json();
                return { success: true, data: result };
            } catch (error) {
                console.error('Error:', error);
                return { 
                    success: false, 
                    error: 'Lỗi kết nối mạng. Vui lòng kiểm tra kết nối của bạn.' 
                };
            }
        }

        // =========================
        // AUTO-FILL FORM FUNCTION
        // =========================
        
        /**
         * Auto-fill form with default address or first address from addresses array
         * @param {Array} addresses - Array of address objects from API
         * @returns {Promise<void>}
         */
        async function autoFillForm(addresses) {
            // Return early if addresses array is empty or not provided
            if (!addresses || addresses.length === 0) {
                console.log('autoFillForm: No addresses to fill');
                return;
            }

            // Find default address where isDefault equals true, fallback to first address
            const addressToFill = addresses.find(addr => addr.isDefault === true) || addresses[0];

            if (!addressToFill) {
                console.warn('autoFillForm: No address found to fill');
                return;
            }

            // Fill fullName field with receiverName
            const fullNameField = document.getElementById('fullName');
            if (fullNameField && addressToFill.receiverName) {
                fullNameField.value = addressToFill.receiverName;
            }

            // Fill phoneNumber field with phoneNumber
            const phoneNumberField = document.getElementById('phoneNumber');
            if (phoneNumberField && addressToFill.phoneNumber) {
                phoneNumberField.value = addressToFill.phoneNumber;
            }

            // Fill streetAddress field with detailAddress
            const streetAddressField = document.getElementById('streetAddress');
            if (streetAddressField && addressToFill.detailAddress) {
                streetAddressField.value = addressToFill.detailAddress;
            }

            // Set defaultAddress checkbox state based on isDefault property
            const defaultAddressCheckbox = document.getElementById('defaultAddress');
            if (defaultAddressCheckbox) {
                defaultAddressCheckbox.checked = addressToFill.isDefault === true;
            }

            // Call selectProvince(), selectDistrict(), selectWard() in sequence with await
            try {
                // Select province and wait for districts to load
                if (addressToFill.province) {
                    const provinceSelected = await selectProvince(addressToFill.province);
                    if (!provinceSelected) {
                        console.warn(`autoFillForm: Failed to select province "${addressToFill.province}"`);
                        return;
                    }
                }

                // Select district and wait for wards to load
                if (addressToFill.district) {
                    const districtSelected = await selectDistrict(addressToFill.district);
                    if (!districtSelected) {
                        console.warn(`autoFillForm: Failed to select district "${addressToFill.district}"`);
                        return;
                    }
                }

                // Select ward
                if (addressToFill.ward) {
                    const wardSelected = selectWard(addressToFill.ward);
                    if (!wardSelected) {
                        console.warn(`autoFillForm: Failed to select ward "${addressToFill.ward}"`);
                    }
                }

                console.log('autoFillForm: Successfully filled form with address');
            } catch (error) {
                console.error('autoFillForm: Error filling form:', error);
            }
        }

        // =========================
        // LOCALSTORAGE MANAGER: Save Shipping Address
        // =========================
        
        /**
         * Save shipping address to localStorage for payment page
         * Constructs fullAddress string and saves all required fields
         * @returns {boolean} - True if save successful, false on error
         */
        function saveShippingToLocalStorage() {
            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('emailAddress').value.trim();
            const province = document.getElementById('citySelect').value;
            const district = document.getElementById('districtSelect').value;
            const ward = document.getElementById('wardSelect').value;
            const streetAddress = document.getElementById('streetAddress').value.trim();
            
            // Construct fullAddress by concatenating detailAddress, ward, district, province
            const fullAddress = `${streetAddress}, ${ward}, ${district}, ${province}`;
            
            const shippingAddress = {
                fullName: fullName,
                phoneNumber: phoneNumber,
                email: email,
                province: province,
                district: district,
                ward: ward,
                detailAddress: streetAddress,
                fullAddress: fullAddress
            };
            
            try {
                localStorage.setItem('shippingAddress', JSON.stringify(shippingAddress));
                return true;
            } catch (e) {
                console.error('Failed to save to localStorage:', e);
                return false;
            }
        }

        // =========================
        // PAGE LOAD: Authentication & Auto-Fill
        // =========================
        
        /**
         * Check authentication and return user info (without redirecting)
         * @returns {Object|null} User info object or null if not authenticated
         */
        function getAuthenticatedUser() {
            const token = localStorage.getItem('pc_store_token');
            const userInfoStr = localStorage.getItem('pc_store_user');
            
            if (!token || !userInfoStr) {
                return null;
            }
            
            try {
                return JSON.parse(userInfoStr);
            } catch (e) {
                console.error('Invalid userInfo in localStorage:', e);
                return null;
            }
        }

        /**
         * Load and auto-fill user addresses (only if authenticated)
         */
        async function loadUserAddresses() {
            const userInfo = getAuthenticatedUser();
            
            if (!userInfo || !userInfo.userId) {
                console.log('No authenticated user - skipping address load');
                return;
            }
            
            console.log('Loading addresses for userId:', userInfo.userId);
            
            // Wait for city dropdown to be fully loaded before auto-fill
            await citiesLoadedPromise;
            
            const addresses = await fetchUserAddresses(userInfo.userId);
            console.log('Loaded addresses:', addresses);
            
            // Auto-fill form if addresses exist
            if (addresses && addresses.length > 0) {
                console.log('Auto-filling form with', addresses.length, 'addresses');
                await autoFillForm(addresses);
            } else {
                console.log('No addresses found - form will be empty');
            }
        }

        // 2. Back button click handler
        const backBtn = document.querySelector(".back-btn");
        if (backBtn) {
            backBtn.addEventListener("click", () => {
                window.location.href = "/shoppingcart";
            });
        }

        // 3. Submit button - Complete integration with REST API
        const submitBtn = document.querySelector(".submit-btn");
        if (submitBtn) {
            submitBtn.addEventListener("click", async (e) => {
                e.preventDefault();

                // 1. Validate form using validateForm()
                if (!validateForm()) {
                    return; // Validation failed, alert already shown
                }

                // 2. Check authentication (ONLY when submitting)
                const userInfo = getAuthenticatedUser();
                
                if (!userInfo) {
                    alert('Vui lòng đăng nhập trước khi tiếp tục thanh toán!');
                    const currentPath = window.location.pathname;
                    window.location.href = `/Login?redirect=${encodeURIComponent(currentPath)}`;
                    return;
                }

                // 3. Extract form data
                const addressData = extractFormData(userInfo.userId);
                
                console.log('Submitting address data:', addressData);
                
                // 4. Save address to database via API
                const saveResult = await saveAddress(addressData);
                
                if (!saveResult.success) {
                    // Show error message
                    alert(`Lỗi: ${saveResult.error}`);
                    return;
                }
                
                console.log('Address saved successfully:', saveResult.data);
                
                // 5. Save shipping address to localStorage and sessionStorage for payment page
                const localStorageSaved = saveShippingToLocalStorage();
                
                // Bridge with payments.html
                sessionStorage.setItem('checkout_addressId', saveResult.data.newAddressId || '');
                sessionStorage.setItem('checkout_address', JSON.stringify({
                    receiverName: addressData.receiverName,
                    phoneNumber: addressData.phoneNumber,
                    fullAddress: addressData.province ? `${addressData.detailAddress}, ${addressData.ward}, ${addressData.district}, ${addressData.province}` : addressData.detailAddress
                }));

                if (!localStorageSaved) {
                    console.warn('Failed to save to localStorage');
                }
                
                // 6. Show success message
                alert('✅ Đã lưu địa chỉ thành công!');
                
                // 7. Redirect to payment page
                window.location.href = '/payments';
            });
        }

        // Update cart count badge from localStorage
        function updateHeaderCartCount() {
            let cartData = [];
            try {
                cartData = JSON.parse(localStorage.getItem('hyper_core_cart')) || JSON.parse(localStorage.getItem('hypercore_cart_items')) || [];
            } catch(e) {}
            const countEl = document.getElementById("cartCount");
            if (countEl) {
                const totalQty = cartData.reduce((acc, item) => acc + item.qty, 0);
                if (totalQty > 0) {
                    countEl.innerText = totalQty;
                    countEl.style.display = "flex";
                } else {
                    countEl.style.display = "none";
                }
            }
        }

        // DOMContentLoaded: Initialize page without forcing authentication
        document.addEventListener("DOMContentLoaded", async () => {
            updateHeaderCartCount();
            
            // Try to load addresses if user is logged in (but don't force login)
            await loadUserAddresses();
        });
    </script>
