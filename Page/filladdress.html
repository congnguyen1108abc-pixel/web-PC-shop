<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Địa Chỉ Giao Hàng - HYPER CORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        :root {
            --blue: #38bdf8;
            --blue-light: #7dd3fc;
            --dark: #020617;
            --dark2: #081120;
            --glass: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .12);
            --text: rgba(255, 255, 255, .7);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left,
                    rgba(56, 189, 248, .18),
                    transparent 25%),
                radial-gradient(circle at bottom right,
                    rgba(14, 165, 233, .14),
                    transparent 25%),
                linear-gradient(180deg,
                    #08101b 0%,
                    #040b14 55%,
                    #01050b 100%);
            overflow-x: hidden;
            color: white;
        }

        /* BACKGROUND */

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .22;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            background: #38bdf8;
            top: -120px;
            left: -120px;
        }

        .orb2 {
            width: 380px;
            height: 380px;
            background: #0ea5e9;
            right: -100px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* CONTAINER */

        .shipping-wrapper {
            width: 100%;
            min-height: auto;
            padding: 40px 20px 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shipping-box {
            width: 100%;
            max-width: 950px;
            background: rgba(15, 23, 42, .72);
            backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 45px;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, .45),
                inset 0 1px 1px rgba(255, 255, 255, .05);
            position: relative;
            overflow: hidden;
        }

        .shipping-box::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(56, 189, 248, .14);
            border-radius: 50%;
            filter: blur(80px);
            top: -120px;
            right: -120px;
        }

        .shipping-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(90deg,
                    #fff,
                    #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .shipping-subtitle {
            color: var(--text);
            margin-bottom: 45px;
            line-height: 1.8;
        }

        /* FORM */

        .form-section {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 25px;
            color: #7dd3fc;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, .82);
            font-weight: 600;
        }

        .required {
            color: #38bdf8;
        }

        .input-field,
        .select-field,
        .textarea-field {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, .1);
            background: rgba(255, 255, 255, .05);
            border-radius: 18px;
            padding: 16px 18px;
            color: white;
            outline: none;
            transition: .3s;
            backdrop-filter: blur(12px);
            font-size: 15px;
        }

        .input-field {
            height: 58px;
        }

        .select-field {
            height: 58px;
            cursor: pointer;
        }

        .textarea-field {
            min-height: 130px;
            resize: none;
        }

        .input-field:focus,
        .select-field:focus,
        .textarea-field:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, .08);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, .12);
        }

        .input-field::placeholder,
        .textarea-field::placeholder {
            color: rgba(255, 255, 255, .42);
        }

        select option {
            background: #081120;
            color: white;
        }

        /* ADDRESS TYPE */

        .address-type {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .type-card {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .type-card input {
            display: none;
        }

        .type-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            cursor: pointer;
            transition: .35s;
        }

        .type-label:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, .08);
        }

        .type-card input:checked+.type-label {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, .14);
            box-shadow: 0 0 20px rgba(56, 189, 248, .18);
        }

        .type-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, .08);
            font-size: 22px;
        }

        .type-text h4 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .type-text p {
            font-size: 13px;
            color: var(--text);
        }

        /* CHECKBOX */

        .checkbox-box {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, .8);
        }

        .checkbox-box input {
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
        }

        /* BUTTONS */

        .action-buttons {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .back-btn,
        .submit-btn {
            height: 58px;
            padding: 0 34px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: .35s;
        }

        .back-btn {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            color: white;
            backdrop-filter: blur(20px);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, .1);
        }

        .submit-btn {
            background: linear-gradient(135deg,
                    #38bdf8,
                    #0ea5e9);
            color: white;
            box-shadow: 0 12px 30px rgba(56, 189, 248, .3);
        }

        .submit-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 35px rgba(56, 189, 248, .4);
        }

        /* RESPONSIVE */

        @media(max-width:768px) {

            .shipping-box {
                padding: 30px 22px;
            }

            .shipping-title {
                font-size: 34px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .back-btn,
            .submit-btn {
                width: 100%;
            }
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        .cart-header {
            width: 100%;
            padding: 30px 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, .5);
        }

        .step.active {
            color: white;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .step.active .step-circle {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        }

        @media(max-width:1000px) {
            .cart-header {
                padding: 25px 20px;
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>

    <!-- HEADER -->
    <div class="cart-header">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='/Homepage'">
            HYPER CORE
        </div>
        <div class="progress">
            <div class="step active">
                <div class="step-circle">1</div>
                <span>Giỏ hàng</span>
            </div>
            <div class="step active">
                <div class="step-circle">2</div>
                <span>Địa chỉ</span>
            </div>
            <div class="step">
                <div class="step-circle">3</div>
                <span>Thanh toán</span>
            </div>
            <div class="step">
                <div class="step-circle">4</div>
                <span>Hoàn tất</span>
            </div>
        </div>
    </div>

    <div class="shipping-wrapper">

        <div class="shipping-box">

            <h1 class="shipping-title">
                Địa Chỉ Giao Hàng
            </h1>

            <p class="shipping-subtitle">
                Hoàn tất thông tin giao hàng để tiếp tục thanh toán đơn hàng tại HYPER CORE.
            </p>

            <!-- PHẦN 1 -->

            <div class="form-section">

                <h2 class="section-title">
                    THÔNG TIN LIÊN HỆ
                </h2>

                <div class="form-grid">

                    <div class="input-group full">

                        <label>
                            Họ và tên <span class="required">*</span>
                        </label>

                        <input type="text" id="fullName" class="input-field" placeholder="Nhập đầy đủ họ và tên của bạn"
                            required />

                    </div>

                    <div class="input-group">

                        <label>
                            Số điện thoại <span class="required">*</span>
                        </label>

                        <input type="tel" id="phoneNumber" class="input-field" placeholder="Ví dụ: 0912345678"
                            pattern="0[0-9]{9}" required />

                    </div>

                    <div class="input-group">

                        <label>
                            Địa chỉ Email
                        </label>

                        <input type="email" id="emailAddress" class="input-field"
                            placeholder="name@example.com (để nhận hóa đơn đơn hàng)" />

                    </div>

                </div>

            </div>

            <!-- PHẦN 2 -->

            <div class="form-section">

                <h2 class="section-title">
                    ĐỊA CHỈ GIAO HÀNG
                </h2>

                <div class="form-grid">

                    <div class="input-group">

                        <label>
                            Tỉnh / Thành phố <span class="required">*</span>
                        </label>

                        <select id="citySelect" class="select-field" required>

                            <option value="">
                                Đang tải danh sách tỉnh thành...
                            </option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label>
                            Quận / Huyện <span class="required">*</span>
                        </label>

                        <select id="districtSelect" class="select-field" required disabled>

                            <option value="">
                                --- Chọn Quận / Huyện ---
                            </option>

                        </select>

                    </div>

                    <div class="input-group full">

                        <label>
                            Phường / Xã <span class="required">*</span>
                        </label>

                        <select id="wardSelect" class="select-field" required disabled>

                            <option value="">
                                --- Chọn Phường / Xã ---
                            </option>

                        </select>

                    </div>

                    <div class="input-group full">

                        <label>
                            Số nhà, tên đường <span class="required">*</span>
                        </label>

                        <input type="text" id="streetAddress" class="input-field"
                            placeholder="Ví dụ: Số 123, ngõ 45, đường Lê Lợi" required />

                    </div>

                </div>

            </div>

            <!-- PHẦN 3 -->

            <div class="form-section">

                <h2 class="section-title">
                    TÙY CHỌN BỔ SUNG
                </h2>

                <div class="address-type">

                    <div class="type-card">

                        <input type="radio" name="addressType" id="home" checked />

                        <label class="type-label" for="home">

                            <div class="type-icon">
                                🏠
                            </div>

                            <div class="type-text">

                                <h4>Nhà riêng</h4>

                                <p>
                                    Giao tất cả các ngày
                                </p>

                            </div>

                        </label>

                    </div>

                    <div class="type-card">

                        <input type="radio" name="addressType" id="office" />

                        <label class="type-label" for="office">

                            <div class="type-icon">
                                🏢
                            </div>

                            <div class="type-text">

                                <h4>Văn phòng</h4>

                                <p>
                                    Giao giờ hành chính
                                </p>

                            </div>

                        </label>

                    </div>

                </div>

                <div class="input-group" style="margin-top:28px;">

                    <label>
                        Ghi chú giao hàng
                    </label>

                    <textarea class="textarea-field"
                        placeholder="Ví dụ: Gọi trước khi giao 15 phút, giao cho bảo vệ nếu tôi vắng mặt..."></textarea>

                </div>

                <div class="checkbox-box">

                    <input type="checkbox" id="defaultAddress" />

                    <label for="defaultAddress">
                        Đặt làm địa chỉ mặc định cho lần mua sau
                    </label>

                </div>

            </div>

            <!-- BUTTON -->

            <div class="action-buttons">

                <button class="back-btn">
                    ← Quay lại giỏ hàng
                </button>

                <button class="submit-btn">
                    TIẾP TỤC THANH TOÁN
                </button>

            </div>

        </div>

    </div>



    <!-- SCRIPT -->
    <script>
        // =========================
        // LOAD ALL PROVINCES (API)
        // =========================
        const citySelect = document.getElementById("citySelect");
        const districtSelect = document.getElementById("districtSelect");
        const wardSelect = document.getElementById("wardSelect");

        async function loadCities() {
            try {
                citySelect.innerHTML = '<option value="">Đang tải danh sách tỉnh thành...</option>';
                const response = await fetch("https://provinces.open-api.vn/api/p/");
                const cities = await response.json();

                citySelect.innerHTML = '<option value="">--- Chọn Tỉnh / Thành phố ---</option>';
                cities.forEach(city => {
                    const option = document.createElement("option");
                    option.value = city.name;
                    option.dataset.code = city.code;
                    option.textContent = city.name;
                    citySelect.appendChild(option);
                });

                // Auto select "Thành phố Hồ Chí Minh" as default
                const defaultCity = [...citySelect.options]
                    .find(option => option.textContent.includes("Hồ Chí Minh"));
                if (defaultCity) {
                    defaultCity.selected = true;
                    citySelect.dispatchEvent(new Event("change"));
                }
            } catch (error) {
                console.error("Lỗi tải tỉnh thành:", error);
                citySelect.innerHTML = '<option value="">Lỗi tải dữ liệu tỉnh thành</option>';
            }
        }

        // =========================
        // LOAD DISTRICTS
        // =========================
        citySelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const cityCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            districtSelect.disabled = true;
            wardSelect.disabled = true;

            if (!cityCode) return;

            try {
                districtSelect.disabled = true;
                districtSelect.innerHTML = '<option value="">Đang tải quận huyện...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/p/${cityCode}?depth=2`);
                const data = await response.json();

                districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
                data.districts.forEach(district => {
                    const option = document.createElement("option");
                    option.value = district.name;
                    option.dataset.code = district.code;
                    option.textContent = district.name;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải quận huyện:", error);
                districtSelect.innerHTML = '<option value="">Lỗi tải dữ liệu quận huyện</option>';
            }
        });

        // =========================
        // LOAD WARDS
        // =========================
        districtSelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const districtCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            wardSelect.disabled = true;

            if (!districtCode) return;

            try {
                wardSelect.disabled = true;
                wardSelect.innerHTML = '<option value="">Đang tải phường xã...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/d/${districtCode}?depth=2`);
                const data = await response.json();

                wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
                data.wards.forEach(ward => {
                    const option = document.createElement("option");
                    option.value = ward.name;
                    option.textContent = ward.name;
                    wardSelect.appendChild(option);
                });
                wardSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải phường xã:", error);
                wardSelect.innerHTML = '<option value="">Lỗi tải dữ liệu phường xã</option>';
            }
        });

        // Initialize loading of cities
        loadCities();

        // 2. Back button click handler
        const backBtn = document.querySelector(".back-btn");
        if (backBtn) {
            backBtn.addEventListener("click", () => {
                window.location.href = "/shoppingcart";
            });
        }

        // 3. Submit button validation & redirect
        const submitBtn = document.querySelector(".submit-btn");
        if (submitBtn) {
            submitBtn.addEventListener("click", (e) => {
                e.preventDefault();

                // Get inputs
                const fullName = document.getElementById("fullName");
                const phoneNumber = document.getElementById("phoneNumber");
                const emailAddress = document.getElementById("emailAddress");
                const streetAddress = document.getElementById("streetAddress");

                // Reset visual error states
                const fields = [fullName, phoneNumber, citySelect, districtSelect, wardSelect, streetAddress];
                fields.forEach(field => {
                    if (field) field.style.borderColor = "rgba(255, 255, 255, 0.1)";
                });

                let isValid = true;
                let firstInvalidField = null;

                // Validate required fields
                fields.forEach(field => {
                    if (field && !field.value.trim()) {
                        field.style.borderColor = "#ff4d4d";
                        isValid = false;
                        if (!firstInvalidField) firstInvalidField = field;
                    }
                });

                // Validate Phone Number pattern (starts with 0, total 10 digits)
                const phoneVal = phoneNumber ? phoneNumber.value.trim() : "";
                const phoneRegex = /^0\d{9}$/;
                if (phoneNumber && phoneVal && !phoneRegex.test(phoneVal)) {
                    phoneNumber.style.borderColor = "#ff4d4d";
                    isValid = false;
                    if (!firstInvalidField) firstInvalidField = phoneNumber;
                    alert("Số điện thoại không hợp lệ! Vui lòng nhập đúng định dạng 10 chữ số (bắt đầu bằng số 0).");
                    return;
                }

                // Validate Email pattern if filled
                const emailVal = emailAddress ? emailAddress.value.trim() : "";
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailAddress && emailVal && !emailRegex.test(emailVal)) {
                    emailAddress.style.borderColor = "#ff4d4d";
                    isValid = false;
                    if (!firstInvalidField) firstInvalidField = emailAddress;
                    alert("Địa chỉ email không hợp lệ!");
                    return;
                }

                if (!isValid) {
                    if (firstInvalidField) {
                        firstInvalidField.focus();
                    }
                    alert("Vui lòng điền đầy đủ và chính xác tất cả các thông tin bắt buộc (*).");
                    return;
                }

                // Thông tin hợp lệ → chuyển sang trang thanh toán
                window.location.href = "/payments";
            });
        }
    </script>

</body>

</html>
