<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Địa Chỉ Giao Hàng - HYPER CORE</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --blue: #38bdf8;
            --blue-light: #7dd3fc;
            --dark: #ffffff;
            --dark2: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --text: #4b5563;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            overflow-x: hidden;
            color: #111827;
        }

        /* BACKGROUND */

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .22;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .orb1 {
            width: 420px;
            height: 420px;
            background: #f3f4f6;
            top: -120px;
            left: -120px;
        }

        .orb2 {
            width: 380px;
            height: 380px;
            background: #e5e7eb;
            right: -100px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        /* CONTAINER */

        .shipping-wrapper {
            width: 100%;
            min-height: auto;
            padding: 40px 20px 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shipping-box {
            width: 100%;
            max-width: 950px;
            background: var(--glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 45px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .shipping-box::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 50%;
            filter: blur(80px);
            top: -120px;
            right: -120px;
        }

        .shipping-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #111827;
        }

        .shipping-subtitle {
            color: var(--text);
            margin-bottom: 45px;
            line-height: 1.8;
        }

        /* FORM */

        .form-section {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 25px;
            color: #111827;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 12px;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }

        .required {
            color: #111827;
        }

        .input-field,
        .select-field,
        .textarea-field {
            width: 100%;
            border: 1px solid #d1d5db;
            background: #f3f4f6;
            border-radius: 18px;
            padding: 16px 18px;
            color: #111827;
            outline: none;
            transition: .3s;
            backdrop-filter: blur(12px);
            font-size: 15px;
        }

        .input-field {
            height: 58px;
        }

        .select-field {
            height: 58px;
            cursor: pointer;
        }

        .textarea-field {
            min-height: 130px;
            resize: none;
        }

        .input-field:focus,
        .select-field:focus,
        .textarea-field:focus {
            border-color: #111827;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.1);
        }

        .input-field::placeholder,
        .textarea-field::placeholder {
            color: #9ca3af;
        }

        select option {
            background: #ffffff;
            color: #111827;
        }

        /* ADDRESS TYPE */

        .address-type {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .type-card {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .type-card input {
            display: none;
        }

        .type-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px;
            border-radius: 22px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            cursor: pointer;
            transition: .35s;
        }

        .type-label:hover {
            transform: translateY(-4px);
            background: #e5e7eb;
        }

        .type-card input:checked+.type-label {
            border-color: #111827;
            background: #e5e7eb;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .type-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-size: 22px;
        }

        .type-text h4 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .type-text p {
            font-size: 13px;
            color: var(--text);
        }

        /* CHECKBOX */

        .checkbox-box {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #374151;
        }

        .checkbox-box input {
            width: 18px;
            height: 18px;
            accent-color: #000000;
        }

        /* BUTTONS */

        .action-buttons {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .back-btn,
        .submit-btn {
            height: 58px;
            padding: 0 34px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: .35s;
        }

        .back-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
            backdrop-filter: blur(20px);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background: #f3f4f6;
        }

        .submit-btn {
            background: #000000;
            color: white;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.3);
        }

        /* RESPONSIVE */

        @media(max-width:768px) {

            .shipping-box {
                padding: 30px 22px;
            }

            .shipping-title {
                font-size: 34px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .back-btn,
            .submit-btn {
                width: 100%;
            }
        }

        /* ================================= */
        /* HEADER */
        /* ================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            transform: none;
            width: 100%;
            height: 78px;
            padding: 0 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            border-radius: 0 0 20px 20px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            transition: .4s ease;
        }

        header, header * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
        }

        header.scrolled {
            background: #FFFFFF;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #000000;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 15px;
            position: relative;
            transition: .3s;
            display: flex;
            align-items: center;
        }

        nav a:hover {
            color: #000000;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -7px;
            width: 0%;
            height: 2px;
            border-radius: 10px;
            background: #555555;
            transition: .3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ================================= */
        /* HEADER ACTIONS */
        /* ================================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-btn {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, .12);
            background: rgba(0, 0, 0, .06);
            backdrop-filter: blur(20px);
            color: #000000;
            cursor: pointer;
            font-size: 18px;
            transition: .35s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, .12);
        }

        .login-glass-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, .14);
            background: rgba(0, 0, 0, .08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: background .35s ease, border .35s ease, transform .35s ease, box-shadow .35s ease;
        }

        .login-glass-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg, transparent, #555555, transparent);
            transform: skewX(-20deg);
            transition: .7s;
        }

        .login-glass-btn:hover::before {
            left: 140%;
        }

        .login-glass-btn:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, .95), rgba(14, 165, 233, .95));
            border: 1px solid rgba(125, 211, 252, .6);
            box-shadow: 0 10px 30px rgba(56, 189, 248, .35), 0 0 20px rgba(125, 211, 252, .25);
            transform: translateY(-3px);
            color: #FFFFFF;
        }

        .login-icon {
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-glass-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, .3);
            background: linear-gradient(135deg, rgba(0, 0, 0, .1), rgba(0, 0, 0, .2));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: .35s ease;
        }

        .register-glass-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(0, 0, 0, .25), transparent);
            transform: skewX(-20deg);
            transition: .7s;
        }

        .register-glass-btn:hover::before {
            left: 140%;
        }

        .register-glass-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            color: #000000;
        }

        /* ========================= */
        /* CHECKOUT PROGRESS */
        /* ========================= */

        .checkout-progress-wrapper {
            margin-top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 70px 10px;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(0, 0, 0, .5);
            font-weight: 600;
        }

        .step.active {
            color: #000000;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .05);
            border: 1px solid rgba(0, 0, 0, .1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .step.active .step-circle {
            background: #000000;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>

    <!-- HEADER -->
    <header id="header">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='/Homepage'">
            <img src="/assets/logo/logoHP_cropped.png" alt="HYPER CORE" style="height: 38px; display: block; object-fit: contain;">
        </div>
        <nav>
            <a href="/Homepage">Trang Chủ</a>
            <a href="/Products">Sản Phẩm</a>
            <a href="/Gaminggear">Gaming Gear</a>
            <a href="#">PC Build</a>
            <a href="#">Trạng thái đơn hàng</a>

        </nav>
        <div class="nav-actions">
            <button class="cart-btn" onclick="window.location.href='/shoppingcart'">

                <span id="cartCount" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:99px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;color:white;">0</span>

                <span class="login-icon">📝</span> <span>Đăng Ký</span>
            </button>
        </div>
    </header>

    <div class="checkout-progress-wrapper">
        <div class="progress">
            <div class="step active">
                <div class="step-circle">1</div>
                <span>Giỏ hàng</span>
            </div>
            <div class="step active">
                <div class="step-circle">2</div>
                <span>Địa chỉ</span>
            </div>
            <div class="step">
                <div class="step-circle">3</div>
                <span>Thanh toán</span>
            </div>
            <div class="step">
                <div class="step-circle">4</div>
                <span>Hoàn tất</span>
            </div>
        </div>
    </div>

    <div class="shipping-wrapper">

        <div class="shipping-box">

            <h1 class="shipping-title">
                Địa Chỉ Giao Hàng
            </h1>

            <p class="shipping-subtitle">
                Hoàn tất thông tin giao hàng để tiếp tục thanh toán đơn hàng tại HYPER CORE.
            </p>

            <!-- PHẦN 1 -->

            <div class="form-section">

                <h2 class="section-title">
                    THÔNG TIN LIÊN HỆ
                </h2>

                <div class="form-grid">

                    <div class="input-group full">

                        <label>
                            Họ và tên <span class="required">*</span>
                        </label>

                        <input type="text" id="fullName" class="input-field" placeholder="Nhập đầy đủ họ và tên của bạn"
                            required />

                    </div>

                    <div class="input-group">

                        <label>
                            Số điện thoại <span class="required">*</span>
                        </label>

                        <input type="tel" id="phoneNumber" class="input-field" placeholder="Ví dụ: 0912345678"
                            pattern="0[0-9]{9}" required />

                    </div>

                    <div class="input-group">

                        <label>
                            Địa chỉ Email
                        </label>

                        <input type="email" id="emailAddress" class="input-field"
                            placeholder="name@example.com (để nhận hóa đơn đơn hàng)" />

                    </div>

                </div>

            </div>

            <!-- PHẦN 2 -->

            <div class="form-section">

                <h2 class="section-title">
                    ĐỊA CHỈ GIAO HÀNG

                <div class="form-grid">

                    <div class="input-group">

                        <label>
                            Tỉnh / Thành phố <span class="required">*</span>

                        <select id="citySelect" class="select-field" required>

                            <option value="">

                    <div class="input-group">

                    <div class="input-group full">

                        <label>
                            Phường / Xã <span class="required">*</span>
                        </label>

                                --- Chọn Phường / Xã ---
                            </option>

                    </div>

                    <div class="input-group full">

                        <label>
                            Số nhà, tên đường <span class="required">*</span>
                        </label>

                        <input type="text" id="streetAddress" class="input-field"

            <!-- PHẦN 3 -->

                            <div class="type-text">

                                <h4>Nhà riêng</h4>

                                <p>

                    <div class="type-card">

                        <input type="radio" name="addressType" id="office" />

                        <label class="type-label" for="office">

                            <div class="type-icon">
                                🏢
                            </div>

                            <div class="type-text">

                                <h4>Văn phòng</h4>

                                <p>
                                    Giao giờ hành chính
                                </p>

                            </div>

                        </label>

                    </div>

                </div>

                <div class="input-group" style="margin-top:28px;">

                    <label>
                        Ghi chú giao hàng
                    </label>

                    <textarea class="textarea-field"
                        placeholder="Ví dụ: Gọi trước khi giao 15 phút, giao cho bảo vệ nếu tôi vắng mặt..."></textarea>

                </div>

                <div class="checkbox-box">

                    <input type="checkbox" id="defaultAddress" />

                    </label>

                </div>

            <!-- BUTTON -->

            <div class="action-buttons">

                <button class="back-btn">
                    ← Quay lại giỏ hàng

                <button class="submit-btn">
                    TIẾP TỤC THANH TOÁN
                </button>

            </div>

        </div>

    </div>



    <!-- SCRIPT -->
    <script src="/assets/js/checkout.js"></script>
    <script>
        // =========================
        // LOAD ALL PROVINCES (API)
        // =========================
        const citySelect = document.getElementById("citySelect");
        const districtSelect = document.getElementById("districtSelect");
        const wardSelect = document.getElementById("wardSelect");

        async function loadCities() {
            try {
                citySelect.innerHTML = '<option value="">Đang tải danh sách tỉnh thành...</option>';
                const response = await fetch("https://provinces.open-api.vn/api/p/");
                const cities = await response.json();

                citySelect.innerHTML = '<option value="">--- Chọn Tỉnh / Thành phố ---</option>';
                cities.forEach(city => {
                    const option = document.createElement("option");
                    option.value = city.name;
                    option.dataset.code = city.code;
                    option.textContent = city.name;
                    citySelect.appendChild(option);
                });

                // Auto select "Thành phố Hồ Chí Minh" as default
                const defaultCity = [...citySelect.options]
                    .find(option => option.textContent.includes("Hồ Chí Minh"));
                if (defaultCity) {
                    defaultCity.selected = true;
                    citySelect.dispatchEvent(new Event("change"));
                }
            } catch (error) {
                console.error("Lỗi tải tỉnh thành:", error);
                citySelect.innerHTML = '<option value="">Lỗi tải dữ liệu tỉnh thành</option>';
            }
        }

        // =========================
        // LOAD DISTRICTS
        // =========================
        citySelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const cityCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            districtSelect.disabled = true;
            wardSelect.disabled = true;

            if (!cityCode) return;

            try {
                districtSelect.disabled = true;
                districtSelect.innerHTML = '<option value="">Đang tải quận huyện...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/p/${cityCode}?depth=2`);
                const data = await response.json();

                districtSelect.innerHTML = '<option value="">--- Chọn Quận / Huyện ---</option>';
                data.districts.forEach(district => {
                    const option = document.createElement("option");
                    option.value = district.name;
                    option.dataset.code = district.code;
                    option.textContent = district.name;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải quận huyện:", error);
                districtSelect.innerHTML = '<option value="">Lỗi tải dữ liệu quận huyện</option>';
            }
        });

        // =========================
        // LOAD WARDS
        // =========================
        districtSelect.addEventListener("change", async function () {
            const selectedOption = this.options[this.selectedIndex];
            const districtCode = selectedOption ? selectedOption.dataset.code : '';

            // RESET
            wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
            wardSelect.disabled = true;

            if (!districtCode) return;

            try {
                wardSelect.disabled = true;
                wardSelect.innerHTML = '<option value="">Đang tải phường xã...</option>';
                const response = await fetch(`https://provinces.open-api.vn/api/d/${districtCode}?depth=2`);
                const data = await response.json();

                wardSelect.innerHTML = '<option value="">--- Chọn Phường / Xã ---</option>';
                data.wards.forEach(ward => {
                    const option = document.createElement("option");
                    option.value = ward.name;
                    option.textContent = ward.name;
                    wardSelect.appendChild(option);
                });
                wardSelect.disabled = false;
            } catch (error) {
                console.error("Lỗi tải phường xã:", error);
                wardSelect.innerHTML = '<option value="">Lỗi tải dữ liệu phường xã</option>';
            }
        });

        // Initialize loading of cities
        loadCities();

        // 2. Back button click handler
        const backBtn = document.querySelector(".back-btn");
        if (backBtn) {
            backBtn.addEventListener("click", () => {
                window.location.href = "/shoppingcart";
            });
        }

        // 3. Submit button validation & save to database
        const submitBtn = document.querySelector(".submit-btn");
        if (submitBtn) {
            submitBtn.addEventListener("click", async (e) => {
                e.preventDefault();

                // Get inputs
                const fullName = document.getElementById("fullName");
                const phoneNumber = document.getElementById("phoneNumber");
                const emailAddress = document.getElementById("emailAddress");
                const streetAddress = document.getElementById("streetAddress");

                // Reset visual error states
                const fields = [fullName, phoneNumber, citySelect, districtSelect, wardSelect, streetAddress];
                fields.forEach(field => {
                    if (field) field.style.borderColor = "rgba(0, 0, 0, 0.2)";
                });

                let isValid = true;
                let firstInvalidField = null;

                // Validate required fields
                fields.forEach(field => {
                    if (field && !field.value.trim()) {
                        field.style.borderColor = "#ff4d4d";
                        isValid = false;
                        if (!firstInvalidField) firstInvalidField = field;
                    }
                });

                // Validate Phone Number pattern (starts with 0, total 10 digits)
                const phoneVal = phoneNumber ? phoneNumber.value.trim() : "";
                const phoneRegex = /^0\d{9}$/;
                if (phoneNumber && phoneVal && !phoneRegex.test(phoneVal)) {
                    phoneNumber.style.borderColor = "#ff4d4d";
                    isValid = false;
                    if (!firstInvalidField) firstInvalidField = phoneNumber;
                    alert("Số điện thoại không hợp lệ! Vui lòng nhập đúng định dạng 10 chữ số (bắt đầu bằng số 0).");
                    return;
                }

                // Validate Email pattern if filled
                const emailVal = emailAddress ? emailAddress.value.trim() : "";
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (emailAddress && emailVal && !emailRegex.test(emailVal)) {
                    emailAddress.style.borderColor = "#ff4d4d";
                    isValid = false;
                    if (!firstInvalidField) firstInvalidField = emailAddress;
                    alert("Địa chỉ email không hợp lệ!");
                    return;
                }

                if (!isValid) {
                    if (firstInvalidField) {
                        firstInvalidField.focus();
                    }
                    alert("Vui lòng điền đầy đủ và chính xác tất cả các thông tin bắt buộc (*).");
                    return;
                }

                // Thông tin hợp lệ → Bắt buộc phải đăng nhập
                
                // Kiểm tra đăng nhập
                const user = JSON.parse(sessionStorage.getItem('hypercore_user') || 'null');
                const token = sessionStorage.getItem('hypercore_token');
                
                if (!user || !token) {
                    alert('Vui lòng đăng nhập trước khi tiếp tục thanh toán!');
                    window.location.href = '/Homepage';
                    return;
                }
                
                // Lưu địa chỉ vào database
                const addressData = {
                    userId: parseInt(user.userId),
                    receiverName: fullName.value.trim(),
                    phoneNumber: phoneNumber.value.trim(),
                    province: citySelect.value,
                    district: districtSelect.value,
                    ward: wardSelect.value,
                    detailAddress: `${streetAddress.value.trim()}, ${wardSelect.value}, ${districtSelect.value}, ${citySelect.value}`,
                    isDefault: document.getElementById('defaultAddress').checked
                };
                
                try {
                    const response = await fetch('http://localhost:5187/api/users/addresses', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(addressData)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        
                        // Lưu addressId và thông tin địa chỉ vào sessionStorage
                        sessionStorage.setItem('checkout_addressId', result.newAddressId);
                        sessionStorage.setItem('checkout_address', JSON.stringify({
                            receiverName: addressData.receiverName,
                            phoneNumber: addressData.phoneNumber,
                            fullAddress: addressData.detailAddress
                        }));
                        
                        // Chuyển sang trang thanh toán
                        window.location.href = '/payments';
                    } else {
                        const error = await response.json();
                        alert(error.message || 'Không thể lưu địa chỉ. Vui lòng thử lại!');
                    }
                } catch (error) {
                    alert('Có lỗi xảy ra khi kết nối đến server. Vui lòng kiểm tra kết nối!');
                }
            });
        }

        // Update cart count badge from localStorage
        function updateHeaderCartCount() {
            let cartData = [];
            try {
                cartData = JSON.parse(localStorage.getItem('hyper_core_cart')) || JSON.parse(localStorage.getItem('hypercore_cart_items')) || [];
            } catch(e) {}
            const countEl = document.getElementById("cartCount");
            if (countEl) {
                const totalQty = cartData.reduce((acc, item) => acc + item.qty, 0);
                if (totalQty > 0) {
                    countEl.innerText = totalQty;
                    countEl.style.display = "flex";
                } else {
                    countEl.style.display = "none";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", updateHeaderCartCount);
    </script>

</body>

</html>
