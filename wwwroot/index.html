<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <title>HYPER CORE - Mechanical Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top left,
                    rgba(56, 189, 248, .15),
                    transparent 30%),

                radial-gradient(circle at bottom right,
                    rgba(37, 99, 235, .15),
                    transparent 35%),

                linear-gradient(180deg,
                    #040812 0%,
                    #02050b 55%,
                    #000000 100%);
            color: white;
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            padding: 0 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.45);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #00d9ff;
            text-shadow: 0 0 15px #00d9ff;
        }

        /* ========================= */
        /* BUTTONS */
        /* ========================= */

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .login-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #00d9ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        .login-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 217, 255, .5);
        }

        .register-btn {
            padding: 10px 20px;
            background: #00d9ff;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 15px rgba(0, 217, 255, .4);
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 217, 255, .8);
        }

        /* ========================= */
        /* HERO */
        /* ========================= */

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100vh;
            padding: 0 120px 0 60px;
            position: relative;
            transition: transform .8s cubic-bezier(.22, 1, .36, 1), opacity .8s ease, filter .8s ease;
        }



        /* ========================= */
        /* CONTENT */
        /* ========================= */

        .content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .neon-logo {
            font-size: clamp(60px, 6vw, 95px);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 700;
            color: #e0f2fe;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #0ea5e9,
                0 0 40px #0ea5e9,
                0 0 80px #0ea5e9;
            margin-bottom: 8px;
            letter-spacing: 6px;
        }

        .flicker-1 { animation: flicker-1 3s linear infinite; }
        .flicker-2 { animation: flicker-2 2.5s linear infinite; }
        .flicker-3 { animation: flicker-3 4s linear infinite; }

        @keyframes flicker-1 {
            0%, 19.9%, 22%, 62.9%, 64%, 64.9%, 70%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ea5e9, 0 0 40px #0ea5e9;
            }
            20%, 21.9%, 63%, 63.9%, 65%, 69.9% {
                opacity: 0.4;
                text-shadow: none;
            }
        }

        @keyframes flicker-2 {
            0%, 40%, 42.9%, 44%, 44.9%, 46%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ea5e9, 0 0 40px #0ea5e9;
            }
            40.1%, 42.8%, 43.1%, 43.9%, 45%, 45.9% {
                opacity: 0.3;
                text-shadow: none;
            }
        }

        @keyframes flicker-3 {
            0%, 80%, 82.9%, 84%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ea5e9, 0 0 40px #0ea5e9;
            }
            80.1%, 82.8%, 83.1%, 83.9% {
                opacity: 0.2;
                text-shadow: none;
            }
        }

        .subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, .85);
            letter-spacing: 4px;
            margin-bottom: 80px;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            display: inline-flex;
            align-items: center;
            text-transform: uppercase;
            min-height: 1.5em;
        }

        .typewriter-cursor {
            display: inline-block;
            color: rgba(0, 217, 255, 0.9);
            margin-left: 6px;
            animation: blinkCursor 0.8s steps(2, start) infinite;
            transition: opacity 1s ease-in-out;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.8);
        }

        @keyframes blinkCursor {
            to { opacity: 0; }
        }

        @keyframes pulseSubtitle {
            0%, 100% {
                opacity: 0.85;
                text-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 18px rgba(0, 217, 255, 0.8);
            }
        }

        .subtitle.pulsing {
            animation: pulseSubtitle 4s ease-in-out infinite;
        }

        /* ========================= */
        /* SWITCH */
        /* ========================= */

        .switch-container {
            perspective: 1200px;
            width: 180px;
            height: 180px;
            cursor: pointer;
        }

        .switch-3d {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(-22deg) rotateY(-18deg);
            transition: transform .35s ease;
        }

        /* SOCKET */

        .socket {
            position: absolute;
            width: 160px;
            height: 160px;
            top: 10px;
            left: 10px;
            background: linear-gradient(145deg, #050505, #111);
            border-radius: 18px;
            transform: translateZ(-20px);
            border: 2px solid #151515;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* KEYCAP */

        .keycap-group {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 20px;
            left: 20px;
            transform-style: preserve-3d;
            transform: translateZ(45px);
            transition: all 0.18s cubic-bezier(.17, .89, .32, 1.4);
        }

        .face {
            position: absolute;
            background: #232323;
            border: 1px solid #333;
            transition: all .25s ease;
        }

        .top {
            width: 140px;
            height: 140px;
            transform: rotateX(0deg) translateZ(35px);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: #888;
            text-align: center;
            line-height: 1.3;
            background: linear-gradient(145deg, #2a2a2a, #171717);
        }

        .front,
        .back {
            width: 140px;
            height: 70px;
            left: 0;
            background: #101010;
        }

        .front {
            top: 35px;
            transform: rotateX(-90deg) translateZ(70px);
        }

        .back {
            top: 35px;
            transform: rotateX(90deg) translateZ(70px);
        }

        .left,
        .right {
            width: 70px;
            height: 140px;
            top: 0;
            background: #141414;
        }

        .left {
            left: 35px;
            transform: rotateY(-90deg) translateZ(70px);
        }

        .right {
            left: 35px;
            transform: rotateY(90deg) translateZ(70px);
        }

        /* HOVER */

        .switch-container:hover .keycap-group {
            transform: translateZ(60px);
        }

        .switch-container:hover .face {
            border-color: #8ff6ff;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .switch-container:hover .top {
            background: linear-gradient(145deg, #00e1ff, #00a7c5);
            color: white;
            text-shadow: 0 0 10px white;
        }

        .switch-container:hover .front,
        .switch-container:hover .back,
        .switch-container:hover .left,
        .switch-container:hover .right {
            background: #00a8c7;
        }

        /* CLICK */

        .switch-container:active .keycap-group {
            transform: translateZ(10px);
        }

        .switch-container:active .face {
            background: #007fa0;
            box-shadow: 0 0 15px rgba(0, 217, 255, 1);
        }

        /* ========================= */
        /* PAGE TRANSITION */
        /* ========================= */

        .page-transition {
            position: fixed;
            inset: 0;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .7s ease;
        }

        .page-transition::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 217, 255, .35), rgba(0, 0, 0, .96) 70%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transform: scale(1.4);
            transition: transform .9s cubic-bezier(.22, 1, .36, 1), opacity .9s ease;
        }

        .page-transition.active {
            opacity: 1;
        }

        .page-transition.active::before {
            transform: scale(1);
        }

        /* EXIT EFFECT */

        body.page-exit .hero,
        body.page-exit header {
            opacity: 0;
            transform: scale(1.05) translateY(-20px);
            filter: blur(10px);
        }

        body.page-exit .switch-3d {
            transform: rotateX(-22deg) rotateY(-18deg) scale(1.15);
            transition: transform .7s cubic-bezier(.22, 1, .36, 1);
        }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>


    <!-- HERO -->

    <div class="hero">

                <model-viewer src="/assets/models/gaming_room.glb" camera-orbit="-45deg 60deg auto" ar ar-modes="webxr scene-viewer quick-look" camera-controls interaction-prompt="none" tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" background-color="transparent" style="width: 50vw; height: 80vh; background-color: transparent; transform: scale(1.4); transform-origin: center center;"></model-viewer>

        <div class="content">

            <h1 class="neon-logo">
                <span class="flicker-1">H</span>Y<span class="flicker-2">PE</span>R C<span class="flicker-3">O</span>RE
            </h1>

            <div class="subtitle" id="welcome-subtitle">
                <span id="typewriter-text"></span><span class="typewriter-cursor" id="typewriter-cursor">|</span>
            </div>

            <!-- SWITCH -->

            <div class="switch-container" id="enterBtn">

                <div class="switch-3d">

                    <div class="socket"></div>

                    <div class="keycap-group">

                        <div class="face top">

                            ENTER
                            <br />
                            STORE

                        </div>

                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face left"></div>
                        <div class="face right"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- PAGE TRANSITION -->

    <div class="page-transition" id="pageTransition">
    </div>

    <!-- SCRIPT -->

    <script>

        /* ========================= */
        /* ENTER BUTTON TRANSITION */
        /* ========================= */

        document.getElementById('enterBtn')

            .addEventListener('click', () => {

                const transition =
                    document.getElementById(
                        'pageTransition'
                    );

                const switch3d =
                    document.querySelector(
                        '.switch-3d'
                    );

                /* PRESS EFFECT */

                switch3d.style.transform =

                    'rotateX(-22deg) rotateY(-18deg) scale(0.92)';

                /* START TRANSITION */

                setTimeout(() => {

                    document.body
                        .classList
                        .add('page-exit');

                    transition
                        .classList
                        .add('active');

                }, 80);

                /* CHANGE PAGE */

                setTimeout(() => {

                    window.location.href =
                        '/Homepage';

                }, 950);

            });

        /* ========================= */
        /* TYPEWRITER EFFECT FOR SLOGAN */
        /* ========================= */

        const textToType = "CHẠM VÀO SỨC MẠNH THỰC THỤ";
        const targetSpan = document.getElementById("typewriter-text");
        const subtitleDiv = document.getElementById("welcome-subtitle");
        let typeIndex = 0;
        let isDeleting = false;

        function typeEffect() {
            const currentString = textToType;

            if (isDeleting) {
                targetSpan.textContent = currentString.substring(0, typeIndex - 1);
                typeIndex--;

                subtitleDiv.classList.remove("pulsing");

                if (typeIndex === 0) {
                    isDeleting = false;
                    setTimeout(typeEffect, 500);
                } else {
                    setTimeout(typeEffect, 50);
                }
            } else {
                targetSpan.textContent = currentString.substring(0, typeIndex + 1);
                typeIndex++;

                if (typeIndex === currentString.length) {
                    isDeleting = true;
                    subtitleDiv.classList.add("pulsing");
                    setTimeout(typeEffect, 2000);
                } else {
                    setTimeout(typeEffect, 100);
                }
            }
        }

        setTimeout(typeEffect, 500);

    </script>

</body>

</html>
