<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <title>PC MASTER - Mechanical Experience</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top left,
                    rgba(56, 189, 248, .15),
                    transparent 30%),

                radial-gradient(circle at bottom right,
                    rgba(37, 99, 235, .15),
                    transparent 35%),

                linear-gradient(180deg,
                    #040812 0%,
                    #02050b 55%,
                    #000000 100%);
            color: white;
        }

        /* ========================= */
        /* HEADER */
        /* ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            padding: 0 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.45);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #00d9ff;
            text-shadow: 0 0 15px #00d9ff;
        }

        /* ========================= */
        /* BUTTONS */
        /* ========================= */

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .login-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #00d9ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
        }

        .login-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 217, 255, .5);
        }

        .register-btn {
            padding: 10px 20px;
            background: #00d9ff;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 15px rgba(0, 217, 255, .4);
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 217, 255, .8);
        }

        /* ========================= */
        /* HERO */
        /* ========================= */

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            transition: transform .8s cubic-bezier(.22, 1, .36, 1), opacity .8s ease, filter .8s ease;
        }

        .scene {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* ========================= */
        /* CONTENT */
        /* ========================= */

        .content {
            position: absolute;
            top: 50%;
            right: 120px;
            transform: translateY(-50%);
            text-align: right;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        h1 {
            font-size: clamp(60px, 6vw, 95px);

            background: linear-gradient(90deg,
                    #ffffff,
                    #7dd3fc,
                    #38bdf8);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 8px;

            text-shadow:
                0 0 20px rgba(125, 211, 252, .25);
        }

        .subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, .72);
            letter-spacing: 4px;
            margin-bottom: 80px;
        }

        /* ========================= */
        /* SWITCH */
        /* ========================= */

        .switch-container {
            perspective: 1200px;
            width: 180px;
            height: 180px;
            cursor: pointer;
        }

        .switch-3d {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(-22deg) rotateY(-18deg);
            transition: transform .35s ease;
        }

        /* SOCKET */

        .socket {
            position: absolute;
            width: 160px;
            height: 160px;
            top: 10px;
            left: 10px;
            background: linear-gradient(145deg, #050505, #111);
            border-radius: 18px;
            transform: translateZ(-20px);
            border: 2px solid #151515;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* KEYCAP */

        .keycap-group {
            position: absolute;
            width: 140px;
            height: 140px;
            top: 20px;
            left: 20px;
            transform-style: preserve-3d;
            transform: translateZ(45px);
            transition: all 0.18s cubic-bezier(.17, .89, .32, 1.4);
        }

        .face {
            position: absolute;
            background: #232323;
            border: 1px solid #333;
            transition: all .25s ease;
        }

        .top {
            width: 140px;
            height: 140px;
            transform: rotateX(0deg) translateZ(35px);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: #888;
            text-align: center;
            line-height: 1.3;
            background: linear-gradient(145deg, #2a2a2a, #171717);
        }

        .front,
        .back {
            width: 140px;
            height: 70px;
            left: 0;
            background: #101010;
        }

        .front {
            top: 35px;
            transform: rotateX(-90deg) translateZ(70px);
        }

        .back {
            top: 35px;
            transform: rotateX(90deg) translateZ(70px);
        }

        .left,
        .right {
            width: 70px;
            height: 140px;
            top: 0;
            background: #141414;
        }

        .left {
            left: 35px;
            transform: rotateY(-90deg) translateZ(70px);
        }

        .right {
            left: 35px;
            transform: rotateY(90deg) translateZ(70px);
        }

        /* HOVER */

        .switch-container:hover .keycap-group {
            transform: translateZ(60px);
        }

        .switch-container:hover .face {
            border-color: #8ff6ff;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .switch-container:hover .top {
            background: linear-gradient(145deg, #00e1ff, #00a7c5);
            color: white;
            text-shadow: 0 0 10px white;
        }

        .switch-container:hover .front,
        .switch-container:hover .back,
        .switch-container:hover .left,
        .switch-container:hover .right {
            background: #00a8c7;
        }

        /* CLICK */

        .switch-container:active .keycap-group {
            transform: translateZ(10px);
        }

        .switch-container:active .face {
            background: #007fa0;
            box-shadow: 0 0 15px rgba(0, 217, 255, 1);
        }

        /* ========================= */
        /* PAGE TRANSITION */
        /* ========================= */

        .page-transition {
            position: fixed;
            inset: 0;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .7s ease;
        }

        .page-transition::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 217, 255, .35), rgba(0, 0, 0, .96) 70%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transform: scale(1.4);
            transition: transform .9s cubic-bezier(.22, 1, .36, 1), opacity .9s ease;
        }

        .page-transition.active {
            opacity: 1;
        }

        .page-transition.active::before {
            transform: scale(1);
        }

        /* EXIT EFFECT */

        body.page-exit .hero,
        body.page-exit header {
            opacity: 0;
            transform: scale(1.05) translateY(-20px);
            filter: blur(10px);
        }

        body.page-exit .switch-3d {
            transform: rotateX(-22deg) rotateY(-18deg) scale(1.15);
            transition: transform .7s cubic-bezier(.22, 1, .36, 1);
        }
    </style>
</head>

<body>


    <!-- HERO -->

    <div class="hero">

        <div class="scene"></div>

        <div class="content">

            <h1>
                PC MASTER
            </h1>

            <div class="subtitle">
                NEXT GEN GAMING EXPERIENCE
            </div>

            <!-- SWITCH -->

            <div class="switch-container" id="enterBtn">

                <div class="switch-3d">

                    <div class="socket"></div>

                    <div class="keycap-group">

                        <div class="face top">

                            ENTER
                            <br />
                            STORE

                        </div>

                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face left"></div>
                        <div class="face right"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- PAGE TRANSITION -->

    <div class="page-transition" id="pageTransition">
    </div>

    <!-- SCRIPT -->

    <script type="module">

        import * as THREE from
            'https://cdn.jsdelivr.net/npm/three@0.179/build/three.module.js';

        const scene = new THREE.Scene();

        const sceneDiv =
            document.querySelector('.scene');

        const camera =
            new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

        camera.position.z = 5;

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,
                alpha: true

            });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        sceneDiv.appendChild(
            renderer.domElement
        );

        /* ========================= */
        /* MAIN OBJECT */
        /* ========================= */

        const group = new THREE.Group();

        group.position.x = -3.5;

        scene.add(group);

        const cube = new THREE.Mesh(

            new THREE.BoxGeometry(
                2.4,
                2.4,
                2.4
            ),

            new THREE.MeshStandardMaterial({

                color: 0x38bdf8,

                wireframe: true,

                emissive: 0x38bdf8,

                emissiveIntensity: 0.5

            })

        );

        group.add(cube);

        const innerCube = new THREE.Mesh(

            new THREE.BoxGeometry(
                1.1,
                1.1,
                1.1
            ),

            new THREE.MeshStandardMaterial({

                color: 0xffffff,

                emissive: 0x38bdf8,

                emissiveIntensity: 0.8

            })

        );

        group.add(innerCube);

        /* LIGHT */

        const blueLight =
            new THREE.PointLight(
                0x38bdf8,
                150
            );

        blueLight.position.set(
            5,
            5,
            5
        );

        scene.add(blueLight);

        /* PARTICLES */

        const particlesGeometry =
            new THREE.BufferGeometry();

        const posArray =
            new Float32Array(4000 * 3);

        for (let i = 0; i < 4000 * 3; i++) {

            posArray[i] =
                (Math.random() - 0.5) * 30;
        }

        particlesGeometry.setAttribute(

            'position',

            new THREE.BufferAttribute(
                posArray,
                3
            )

        );

        const particles = new THREE.Points(

            particlesGeometry,

            new THREE.PointsMaterial({

                color: 0x38bdf8,
                size: 0.015

            })

        );

        scene.add(particles);

        /* DRAG ROTATE */

        let isDragging = false;

        let prevMouse = {
            x: 0,
            y: 0
        };

        document.addEventListener(
            'mousedown',
            () => isDragging = true
        );

        document.addEventListener(
            'mouseup',
            () => isDragging = false
        );

        document.addEventListener(
            'mousemove',
            (e) => {

                if (isDragging) {

                    group.rotation.y +=
                        (e.clientX - prevMouse.x) * 0.01;

                    group.rotation.x +=
                        (e.clientY - prevMouse.y) * 0.01;
                }

                prevMouse = {
                    x: e.clientX,
                    y: e.clientY
                };

            }
        );

        /* ========================= */
        /* ENTER BUTTON TRANSITION */
        /* ========================= */

        document.getElementById('enterBtn')

            .addEventListener('click', () => {

                const transition =
                    document.getElementById(
                        'pageTransition'
                    );

                const switch3d =
                    document.querySelector(
                        '.switch-3d'
                    );

                /* PRESS EFFECT */

                switch3d.style.transform =

                    'rotateX(-22deg) rotateY(-18deg) scale(0.92)';

                /* START TRANSITION */

                setTimeout(() => {

                    document.body
                        .classList
                        .add('page-exit');

                    transition
                        .classList
                        .add('active');

                }, 80);

                /* CHANGE PAGE */

                setTimeout(() => {

                    window.location.href =
                        '/Homepage';

                }, 950);

            });

        /* RESIZE */

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

        /* ========================= */
        /* ANIMATION */
        /* ========================= */

        function animate() {

            requestAnimationFrame(
                animate
            );

            cube.rotation.x += 0.002;

            cube.rotation.y += 0.002;

            group.position.y =

                Math.sin(
                    Date.now() * 0.002
                ) * 0.15;

            particles.rotation.y += 0.0003;

            renderer.render(
                scene,
                camera
            );

        }

        animate();

    </script>

</body>

</html>
