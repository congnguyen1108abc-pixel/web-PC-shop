<style>
    .widget-popup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .65);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        opacity: 0;
        pointer-events: none;
        transition: .4s cubic-bezier(.22, 1, .36, 1);
    }

    .widget-popup.active {
        opacity: 1;
        pointer-events: all;
    }

    .widget-box {
        width: 430px;
        background: rgba(15, 23, 42, .88);
        backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 34px;
        padding: 50px 40px;
        position: relative;
        overflow: hidden;

        transform: translateY(30px) scale(.95);
        transition: .5s cubic-bezier(.22, 1, .36, 1);

        box-shadow:
            0 25px 50px rgba(0, 0, 0, .5),
            inset 0 1px 1px rgba(255, 255, 255, .05);
    }

    .widget-popup.active .widget-box {
        transform: translateY(0) scale(1);
    }

    /* GLOW */

    .widget-box::before {
        content: "";
        position: absolute;
        width: 240px;
        height: 240px;
        background: rgba(56, 189, 248, .18);
        border-radius: 50%;
        filter: blur(80px);
        top: -120px;
        right: -120px;
    }

    .widget-title {
        font-size: 34px;
        margin-bottom: 12px;
        text-align: center;
        font-weight: 800;

        background: linear-gradient(90deg, #fff, #7dd3fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .widget-subtitle {
        text-align: center;
        color: rgba(255, 255, 255, .55);
        margin-bottom: 35px;
        font-size: 15px;
        line-height: 1.6;
    }

    .widget-input {
        width: 100%;
        height: 60px;
        margin-bottom: 18px;
        border-radius: 18px;

        border: 1px solid rgba(255, 255, 255, .1);

        background: rgba(255, 255, 255, .05);

        padding: 0 20px;

        color: white;
        outline: none;
        font-size: 16px;

        transition: .3s;
    }

    .widget-input:focus {
        border-color: #38bdf8;
        background: rgba(255, 255, 255, .08);

        box-shadow:
            0 0 0 4px rgba(56, 189, 248, .12);
    }

    .widget-input::placeholder {
        color: rgba(255, 255, 255, .4);
    }

    /* OPTIONS */

    .widget-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .remember-box {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, .65);
    }

    .remember-box input {
        accent-color: #38bdf8;
    }

    .forgot-link {
        color: #7dd3fc;
        text-decoration: none;
        transition: .3s;
    }

    .forgot-link:hover {
        color: white;
    }

    /* LOGIN BUTTON */

    .widget-submit {
        width: 100%;
        height: 58px;

        border: none;
        border-radius: 18px;

        background: linear-gradient(135deg, #38bdf8, #0ea5e9);

        color: white;
        font-size: 16px;
        font-weight: 700;

        cursor: pointer;
        transition: .35s;
    }

    .widget-submit:hover {
        transform: translateY(-3px);

        box-shadow:
            0 12px 30px rgba(56, 189, 248, .35);
    }

    /* DIVIDER */

    .divider {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 28px 0;
        color: rgba(255, 255, 255, .35);
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, .08);
    }

    /* GOOGLE */

    .google-btn {
        width: 100%;
        height: 58px;

        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, .12);

        background: rgba(255, 255, 255, .06);

        backdrop-filter: blur(20px);

        color: white;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;

        cursor: pointer;
        transition: .35s;
    }

    .google-btn:hover {
        transform: translateY(-3px);

        background: rgba(255, 255, 255, .1);

        border-color: rgba(125, 211, 252, .45);
    }

    .google-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: white;
        color: #4285F4;

        display: flex;
        justify-content: center;
        align-items: center;

        font-weight: bold;
        font-size: 14px;
    }

    /* REGISTER */

    .register-text {
        text-align: center;
        margin-top: 28px;
        color: rgba(255, 255, 255, .55);
        font-size: 14px;
    }

    .register-link {
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 600;
        cursor: pointer !important;
        transition: .3s;
    }

    .register-link:hover {
        color: white;
    }

    /* CLOSE */

    .widget-close {
        position: absolute;
        top: 18px;
        right: 18px;

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 14px;

        background: rgba(255, 255, 255, .08);

        color: white;
        cursor: pointer;

        font-size: 18px;

        transition: .3s;
    }

    .widget-close:hover {
        background: rgba(255, 255, 255, .14);
        transform: rotate(90deg);
    }

    .register-text .register-link {
        cursor: pointer;
    }
</style>

<!-- LOGIN POPUP -->

<div class="widget-popup" id="loginPopup">

    <div class="widget-box">

        <button class="widget-close" onclick="closeLoginPopup()">
            ✕
        </button>

        <h2 class="widget-title">
            Đăng Nhập
        </h2>

        <p class="widget-subtitle">
            Chào mừng quay trở lại HYPER CORE
        </p>

        <input type="text" class="widget-input" placeholder="Tên đăng nhập" />

        <input type="password" class="widget-input" placeholder="Mật khẩu" />

        <!-- OPTIONS -->

        <div class="widget-options">

            <label class="remember-box">

                <input type="checkbox" />

                <span>Nhớ mật khẩu</span>

            </label>

            <a href="#" class="forgot-link">
                Quên mật khẩu?
            </a>

        </div>

        <!-- LOGIN -->

        <button class="widget-submit">
            Đăng Nhập
        </button>

        <!-- DIVIDER -->

        <div class="divider">
            HOẶC
        </div>

        <!-- GOOGLE LOGIN -->

        <button class="google-btn">

            <div class="google-icon">
                G
            </div>

            <span>
                Đăng nhập bằng Google
            </span>

        </button>

        <!-- REGISTER -->

        <div class="register-text">

            Chưa có tài khoản?

            <a href="javascript:void(0)" class="register-link" onclick="switchToRegister()">Đăng ký ngay</a>

        </div>

    </div>

</div>

</div>
