<style>
    .widget-popup {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .65);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        opacity: 0;
        pointer-events: none;
        transition: .4s cubic-bezier(.22, 1, .36, 1);
    }

    .widget-popup.active {
        opacity: 1;
        pointer-events: all;
    }

    .widget-box {
        width: 430px;
        background: rgba(15, 23, 42, .88);
        backdrop-filter: blur(28px);
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 34px;
        padding: 50px 40px;
        position: relative;
        overflow: hidden;
        transform: translateY(30px) scale(.95);
        transition: .5s cubic-bezier(.22, 1, .36, 1);
        box-shadow: 0 25px 50px rgba(0, 0, 0, .5), inset 0 1px 1px rgba(255, 255, 255, .05);
    }

    .widget-popup.active .widget-box {
        transform: translateY(0) scale(1);
    }

    .widget-box::before {
        content: "";
        position: absolute;
        width: 240px;
        height: 240px;
        background: rgba(125, 211, 252, .18);
        border-radius: 50%;
        filter: blur(80px);
        top: -120px;
        right: -120px;
    }

    .widget-title {
        font-size: 34px;
        margin-bottom: 12px;
        text-align: center;
        font-weight: 800;
        background: linear-gradient(90deg, #fff, #7dd3fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .widget-subtitle {
        text-align: center;
        color: rgba(255, 255, 255, .55);
        margin-bottom: 35px;
        font-size: 15px;
        line-height: 1.6;
    }

    .widget-input {
        width: 100%;
        height: 60px;
        margin-bottom: 18px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, .1);
        background: rgba(255, 255, 255, .05);
        padding: 0 20px;
        color: white;
        outline: none;
        font-size: 16px;
        transition: .3s;
    }

    .widget-input:focus {
        border-color: #38bdf8;
        background: rgba(255, 255, 255, .08);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, .12);
    }

    .widget-input.error {
        border-color: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, .12);
    }

    .error-msg {
        color: #ef4444;
        font-size: 12px;
        margin-top: -12px;
        margin-bottom: 12px;
        margin-left: 10px;
        display: none;
    }

    .widget-submit {
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: .35s;
        margin-top: 10px;
    }

    .widget-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(56, 189, 248, .35);
    }

    .login-text {
        text-align: center;
        margin-top: 28px;
        color: rgba(255, 255, 255, .55);
        font-size: 14px;
    }

    .login-link {
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 600;
        transition: .3s;
        cursor: pointer;
    }

    .login-link:hover {
        color: white;
    }

    .widget-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 255, .08);
        color: white;
        cursor: pointer;
        font-size: 18px;
        transition: .3s;
    }

    .widget-close:hover {
        background: rgba(255, 255, 255, .14);
        transform: rotate(90deg);
    }
</style>

<div class="widget-popup" id="registerPopup">
    <div class="widget-box">
        <button class="widget-close" onclick="closeRegisterPopup()">✕</button>
        <h2 class="widget-title">Đăng Ký</h2>
        <p class="widget-subtitle">Tạo tài khoản để trải nghiệm HYPER CORE</p>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <input type="text" class="widget-input" id="regUser" placeholder="Tên đăng nhập" required />
            <div id="userError" class="error-msg">Tên đăng nhập tối thiểu 3 ký tự</div>

            <input type="email" class="widget-input" id="regEmail" placeholder="Email" required />
            <div id="emailError" class="error-msg">Email không hợp lệ</div>

            <input type="password" class="widget-input" id="regPass" placeholder="Mật khẩu" required />
            <div id="passError" class="error-msg">Mật khẩu tối thiểu 6 ký tự</div>

            <input type="password" class="widget-input" id="regConfirm" placeholder="Xác nhận mật khẩu" required />
            <div id="confirmError" class="error-msg">Mật khẩu xác nhận không khớp</div>

            <button type="submit" class="widget-submit">Đăng Ký Ngay</button>
        </form>

        <div class="login-text">
            Đã có tài khoản?
            <a class="login-link" onclick="switchToLogin()">Đăng nhập</a>
        </div>
    </div>
</div>

</div>
<script>

    function closeRegisterPopup() {
        document
            .getElementById("registerPopup")
            .classList.remove("active");
    }

    function switchToLogin() {

        document
            .getElementById("registerPopup")
            .classList.remove("active");

        document
            .getElementById("loginPopup")
            .classList.add("active");
    }

    function handleRegister(event) {

        event.preventDefault();

        /* INPUT */

        const user = document.getElementById("regUser");
        const email = document.getElementById("regEmail");
        const pass = document.getElementById("regPass");
        const confirm = document.getElementById("regConfirm");

        /* ERROR */

        const userError = document.getElementById("userError");
        const emailError = document.getElementById("emailError");
        const passError = document.getElementById("passError");
        const confirmError = document.getElementById("confirmError");

        /* RESET */

        document.querySelectorAll(".widget-input")
            .forEach(input => {
                input.classList.remove("error");
            });

        document.querySelectorAll(".error-msg")
            .forEach(msg => {
                msg.style.display = "none";
            });

        let valid = true;

        /* ============================= */
        /* USERNAME VALIDATION */
        /* ============================= */

        if (user.value.trim().length < 3) {

            user.classList.add("error");
            userError.style.display = "block";

            valid = false;
        }

        /* KHÔNG CHO KHOẢNG TRẮNG */

        if (user.value.includes(" ")) {

            user.classList.add("error");
            userError.innerText =
                "Tên đăng nhập không được chứa khoảng trắng";

            userError.style.display = "block";

            valid = false;
        }

        /* ============================= */
        /* EMAIL VALIDATION */
        /* ============================= */

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email.value)) {

            email.classList.add("error");
            emailError.style.display = "block";

            valid = false;
        }

        /* ============================= */
        /* PASSWORD VALIDATION */
        /* ============================= */

        /* tối thiểu 6 ký tự */

        if (pass.value.length < 6) {

            pass.classList.add("error");
            passError.innerText =
                "Mật khẩu tối thiểu 6 ký tự";

            passError.style.display = "block";

            valid = false;
        }

        /* phải có chữ hoa */

        else if (!/[A-Z]/.test(pass.value)) {

            pass.classList.add("error");
            passError.innerText =
                "Mật khẩu phải có ít nhất 1 chữ in hoa";

            passError.style.display = "block";

            valid = false;
        }

        /* phải có số */

        else if (!/[0-9]/.test(pass.value)) {

            pass.classList.add("error");
            passError.innerText =
                "Mật khẩu phải có ít nhất 1 chữ số";

            passError.style.display = "block";

            valid = false;
        }

        /* ============================= */
        /* CONFIRM PASSWORD */
        /* ============================= */

        if (confirm.value !== pass.value) {

            confirm.classList.add("error");
            confirmError.style.display = "block";

            valid = false;
        }

        /* ============================= */
        /* SUCCESS */
        /* ============================= */

        if (valid) {

            alert("Đăng ký thành công 🚀");

            document
                .getElementById("registerForm")
                .reset();

            closeRegisterPopup();
        }

        return false;
    }

    /* ================================= */
    /* REALTIME VALIDATION */
    /* ================================= */

    document
        .getElementById("regUser")
        .addEventListener("input", function () {

            if (this.value.trim().length >= 3 &&
                !this.value.includes(" ")) {

                this.classList.remove("error");
                userError.style.display = "none";
            }

        });

    document
        .getElementById("regEmail")
        .addEventListener("input", function () {

            const pattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (pattern.test(this.value)) {

                this.classList.remove("error");
                emailError.style.display = "none";
            }

        });

    document
        .getElementById("regPass")
        .addEventListener("input", function () {

            const value = this.value;

            if (
                value.length >= 6 &&
                /[A-Z]/.test(value) &&
                /[0-9]/.test(value)
            ) {

                this.classList.remove("error");
                passError.style.display = "none";
            }

        });

    document
        .getElementById("regConfirm")
        .addEventListener("input", function () {

            const pass =
                document.getElementById("regPass").value;

            if (this.value === pass) {

                this.classList.remove("error");
                confirmError.style.display = "none";
            }

        });

</script>
